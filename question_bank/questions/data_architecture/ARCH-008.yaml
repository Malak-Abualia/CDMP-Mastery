estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "In TOGAF's four-domain decomposition (Business, Data, Application, Technology Architecture), which domain is primarily responsible for defining *why* certain data is needed?"
answer_choices:
  - "A) Technology Architecture"
  - "B) Application Architecture"
  - "C) Business Architecture"
  - "D) Data Architecture"
correct_answer: "C"
explanation: "Business Architecture defines business strategy, capabilities, and processes — it drives Data Architecture requirements by determining which business capabilities require which data, i.e., defining the 'why.'"
why_incorrect:
  - option: "A"
    reason: "Technology Architecture provides the infrastructure substrate hosting data and applications — it constrains and enables, but doesn't define why data is needed."
  - option: "B"
    reason: "Application Architecture depends on Data Architecture to know what structures and flows applications must support — it doesn't originate the 'why.'"
  - option: "D"
    reason: "Data Architecture defines the structures and flows needed to support business capabilities — it responds to the 'why' Business Architecture establishes, rather than originating it."
