estimated_solving_time: 50
question_type: "Multiple Select"
stem: "Which of the following are legitimate, business-relevant MDM program success metrics? (Select all that apply.)"
answer_choices:
  - "A) Match rate — the percentage of candidate records successfully matched/consolidated"
  - "B) Duplicate reduction rate — the decline in known duplicate entities over time"
  - "C) Golden record adoption — the percentage of consuming systems actually using the golden record"
  - "D) Total lines of matching code written by the engineering team"
correct_answer: ["A", "B", "C"]
explanation: "A, B, and C are concrete, business-relevant measures that demonstrate MDM's ongoing value — directly addressing MDM's documented risk of being underfunded due to diffuse, hard-to-demonstrate value."
why_incorrect:
  - option: "D"
    reason: "Lines of code is an engineering vanity metric with no direct business meaning and does not demonstrate MDM program value to stakeholders."
