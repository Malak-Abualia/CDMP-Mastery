question_type: "Multiple Choice"
stem: "What is Content, as distinct from a Document?"
answer_choices:
  - "A) Only information stored in a discrete file"
  - "B) The broader category of structured, semi-structured, or unstructured information held within documents, systems, or platforms, including web content and media"
  - "C) A document specifically designated as legal evidence"
  - "D) A database table's physical storage format"
correct_answer: "B"
explanation: "Content is the broader category of information — including web content and media, not just discrete files — of which a document is often, but not always, a container."
why_incorrect:
  - option: "A"
    reason: "This understates Content's scope, which extends beyond discrete files to web content, media, and platform-held information generally."
  - option: "C"
    reason: "This describes a Record, a narrower, more formally governed subset of content."
  - option: "D"
    reason: "This describes structured database storage, an unrelated Data Storage and Operations concern."
