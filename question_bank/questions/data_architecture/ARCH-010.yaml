estimated_solving_time: 50
question_type: "Multiple Select"
stem: "Which of the following are examples of Data Architecture *artifacts* (as opposed to standards)? (Select all that apply.)"
answer_choices:
  - "A) An enterprise data flow diagram showing how Customer data moves between systems"
  - "B) A rule stating all cross-domain integration must use the event bus, not direct database access"
  - "C) A data architecture roadmap sequencing future-state initiatives"
  - "D) A naming convention applied across all data models enterprise-wide"
correct_answer: ["A", "C"]
explanation: "A and C are artifacts — deliverables describing current/future data landscape state (diagrams, roadmaps). B and D are standards — enterprise-level rules governing technology/integration choices and naming conventions."
why_incorrect:
  - option: "B"
    reason: "This is a Data Architecture Standard (an approved integration pattern rule), not an artifact describing current/future state."
  - option: "D"
    reason: "This is also a Data Architecture Standard (a naming convention rule), not a descriptive artifact."
