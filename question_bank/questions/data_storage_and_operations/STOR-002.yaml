estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "What does Recovery Time Objective (RTO) measure?"
answer_choices:
  - "A) The maximum acceptable amount of time to restore a system to operation after a failure"
  - "B) The maximum acceptable amount of data loss following a failure"
  - "C) The frequency of scheduled database backups"
  - "D) The number of replicated copies of a database"
correct_answer: "A"
explanation: "RTO answers 'how long can we afford to be down,' driven by how quickly a system can actually be restored and made operational again."
why_incorrect:
  - option: "B"
    reason: "This describes Recovery Point Objective (RPO), a distinct and independent recovery target."
  - option: "C"
    reason: "Backup frequency is one input that influences RPO, not the definition of RTO itself."
  - option: "D"
    reason: "Replica count is an architectural detail supporting recovery, not the definition of RTO."
