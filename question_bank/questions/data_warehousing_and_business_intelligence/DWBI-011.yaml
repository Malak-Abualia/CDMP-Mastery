estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "What is the primary purpose of a conformed dimension in a Kimball-style warehouse?"
answer_choices:
  - "A) To store raw data before transformation"
  - "B) To keep multiple, incrementally-delivered data marts consistent with each other"
  - "C) To enforce database-level referential integrity constraints"
  - "D) To calculate warehouse storage costs"
correct_answer: "B"
explanation: "A conformed dimension is shared and consistently defined (e.g., Customer, Product, Date) and reused across multiple data marts, which is specifically what keeps incrementally-delivered marts consistent with each other despite not being built from a single upfront normalized core."
why_incorrect:
  - option: "A"
    reason: "Storing raw pre-transformation data describes a staging area, not a conformed dimension."
  - option: "C"
    reason: "Referential integrity is a database-level technical mechanism; a conformed dimension is a governed business/modeling concept, though it may be implemented using such constraints."
  - option: "D"
    reason: "Cost calculation is an unrelated operational concern, not the purpose of a conformed dimension."
