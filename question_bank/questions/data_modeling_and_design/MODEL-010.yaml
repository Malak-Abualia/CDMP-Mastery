estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A project team wants a business stakeholder, who has no technical background, to confirm that the proposed data structures correctly represent how the business thinks about 'Order' and 'Customer.' Which model should be used for this review?"
answer_choices:
  - "A) The Physical Data Model, since it is the most complete and detailed"
  - "B) The Conceptual Data Model"
  - "C) The database's index and partitioning strategy"
  - "D) The ETL pipeline's transformation code"
correct_answer: "B"
explanation: "The Conceptual Data Model is business-level and technology-agnostic, containing only entities and relationships — exactly the level a non-technical stakeholder can meaningfully validate."
why_incorrect:
  - option: "A"
    reason: "A Physical Data Model requires technical knowledge (data types, constraints) that a non-technical stakeholder cannot meaningfully assess."
  - option: "C"
    reason: "Index and partitioning strategy is a physical-level performance concern, entirely outside what a business stakeholder should be asked to validate."
  - option: "D"
    reason: "Pipeline transformation code is an implementation artifact, not a modeling deliverable suited for business review."
