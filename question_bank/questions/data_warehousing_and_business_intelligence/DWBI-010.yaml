estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "An e-commerce checkout system must process thousands of individual order transactions per minute with strict consistency and low latency. Which workload optimization does this system need?"
answer_choices:
  - "A) OLAP"
  - "B) OLTP"
  - "C) ELT"
  - "D) Self-service BI"
correct_answer: "B"
explanation: "OLTP (Online Transactional Processing) is specifically optimized for fast, reliable, single-record transactions — exactly the checkout system's requirement."
why_incorrect:
  - option: "A"
    reason: "OLAP is optimized for complex, multidimensional analytical queries, not high-volume single-record transactions."
  - option: "C"
    reason: "ELT is a data-loading pattern for analytical stores, unrelated to a live transactional checkout system's workload needs."
  - option: "D"
    reason: "Self-service BI is a reporting/analysis consumption pattern, unrelated to transactional system design."
