estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A company maintains a controlled list of currency codes (USD, EUR, GBP, JPY) used consistently across its financial systems, based on the ISO 4217 standard. What kind of data is this?"
answer_choices:
  - "A) Master Data"
  - "B) Reference Data"
  - "C) A Golden Record"
  - "D) Operational Metadata"
correct_answer: "B"
explanation: "A controlled, standardized set of currency codes is Reference Data — it classifies other data (a transaction's currency) rather than representing a unique real-world business entity."
why_incorrect:
  - option: "A"
    reason: "Master Data represents a unique shared business entity, such as Customer or Product, not a controlled value list."
  - option: "C"
    reason: "A Golden Record is a synthesized, authoritative entity record, not a static code list."
  - option: "D"
    reason: "Operational Metadata describes execution/runtime facts, unrelated to a controlled classification value set."
