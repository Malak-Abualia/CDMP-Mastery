question_type: "Multiple Choice"
stem: "What is Data Minimization?"
answer_choices:
  - "A) Collecting and retaining only the data actually needed for a defined purpose"
  - "B) Reducing the physical size of a database through compression"
  - "C) Minimizing the number of employees with database access"
  - "D) Reducing the number of data quality dimensions checked"
correct_answer: "A"
explanation: "Data Minimization means collecting and retaining only the data actually needed for a defined purpose, rather than defaulting to broad collection 'in case it's useful later.'"
why_incorrect:
  - option: "B"
    reason: "This describes data compression, a storage optimization technique, unrelated to purpose-driven collection scope."
  - option: "C"
    reason: "This describes Least Privilege, a Data Security access-scoping principle, distinct from data collection scope."
  - option: "D"
    reason: "Data Minimization concerns collection/retention scope, not the number of quality checks applied."
