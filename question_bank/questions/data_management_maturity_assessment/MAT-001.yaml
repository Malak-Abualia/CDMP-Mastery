stem: "What is Data Management Maturity Assessment?"
answer_choices:
  - "A) The evaluation of an organization's data management capabilities against a defined set of criteria, to identify strengths, gaps, and improvement priorities"
  - "B) The technical process of verifying a user's identity before granting access"
  - "C) A governance artifact documenting data sharing terms between systems"
  - "D) The process of extracting insight and building predictive models from data"
correct_answer: "A"
explanation: "Data Management Maturity Assessment evaluates an organization's data management capabilities against defined criteria, identifying strengths, gaps, and improvement priorities."
why_incorrect:
  - option: "B"
    reason: "This describes Authentication, a Data Security concept, unrelated to capability evaluation."
  - option: "C"
    reason: "This describes a Data Sharing Agreement, a Data Integration and Interoperability governance artifact."
  - option: "D"
    reason: "This describes Data Science, a distinct analytical discipline, not maturity evaluation."
