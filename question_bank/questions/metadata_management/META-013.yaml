question_type: "Multiple Choice"
stem: "Who is typically the primary, hands-on curator of business glossary term definitions?"
answer_choices:
  - "A) Data Custodian"
  - "B) Data Steward"
  - "C) Data Engineer"
  - "D) A metadata repository vendor"
correct_answer: "B"
explanation: "The Data Steward is the primary hands-on curator of business metadata — maintaining glossary term definitions and classification tags, working with technical teams to ensure metadata matches reality."
why_incorrect:
  - option: "A"
    reason: "The Custodian focuses on safe technical storage and handling, not curating business-meaning content."
  - option: "C"
    reason: "The Data Engineer is a primary producer and consumer of technical/operational metadata, and a consumer of the glossary, but not typically its primary curator."
  - option: "D"
    reason: "A vendor supplies the tooling mechanism, not the accountable curation of business content."
