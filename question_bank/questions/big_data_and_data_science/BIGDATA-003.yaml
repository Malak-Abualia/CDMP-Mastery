stem: "What is a Data Lake?"
answer_choices:
  - "A) A large-scale storage repository holding raw data in its native format, structured or unstructured, without requiring a predefined schema at ingestion"
  - "B) An integrated, subject-oriented, time-variant, non-volatile store supporting enterprise reporting"
  - "C) A model that has learned training data's noise rather than the general pattern"
  - "D) A governed policy specifying how long a record must be retained"
correct_answer: "A"
explanation: "A Data Lake holds raw data in its native format, structured or unstructured, without requiring a predefined schema at ingestion — the schema-on-read approach."
why_incorrect:
  - option: "B"
    reason: "This describes a Data Warehouse, which uses the opposite schema-on-write approach."
  - option: "C"
    reason: "This describes Overfitting, a machine learning modeling concept, unrelated to storage architecture."
  - option: "D"
    reason: "This describes a Records Retention Schedule, a Document and Content Management concept."
