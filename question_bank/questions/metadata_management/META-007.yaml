estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A documented rule states: 'Revenue excludes refunds issued within 30 days.' Which metadata category does this belong to?"
answer_choices:
  - "A) Technical Metadata"
  - "B) Operational Metadata"
  - "C) Business Metadata"
  - "D) Data Lineage"
correct_answer: "C"
explanation: "A documented business rule defining how a term is calculated is Business Metadata — it concerns meaning for business consumers, not technical structure or execution facts."
why_incorrect:
  - option: "A"
    reason: "This rule describes business meaning, not the technical structure of a database field."
  - option: "B"
    reason: "This is a static business rule, not a runtime execution fact."
  - option: "D"
    reason: "Lineage traces data's transformation history, not the business definition of a calculated term."
