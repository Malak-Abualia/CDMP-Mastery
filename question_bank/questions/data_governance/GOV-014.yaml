estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A company names an employee 'Customer Data Steward' as an additional responsibility, with no dedicated time allocation and no real authority to enforce decisions. What is the most likely long-term outcome, per DAMA's documented common mistakes?"
answer_choices:
  - "A) The role will function effectively regardless of time or authority"
  - "B) The role will exist on paper only, without producing real stewardship outcomes"
  - "C) This is the correct, lightweight way to implement stewardship"
  - "D) The employee will automatically be granted Data Owner authority over time"
correct_answer: "B"
explanation: "DMBOK2-aligned practice recognizes that stewardship requires real authority and allocated time; without both, the title becomes symbolic rather than operational."
why_incorrect:
  - option: "A"
    reason: "This ignores the well-documented failure pattern of unsupported stewardship appointments."
  - option: "C"
    reason: "This is a documented anti-pattern, not a correct lightweight implementation of stewardship."
  - option: "D"
    reason: "Authority doesn't transfer automatically — Owner accountability is a distinct, deliberately assigned role."
