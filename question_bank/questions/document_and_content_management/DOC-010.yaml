question_type: "Multiple Choice"
stem: "An organization introduces a consistent classification scheme so that content across departments can be organized and found using shared categories rather than ad hoc, department-specific folder structures. What is this scheme called?"
answer_choices:
  - "A) A Records Retention Schedule"
  - "B) A Taxonomy"
  - "C) A Legal Hold"
  - "D) A Data Contract"
correct_answer: "B"
explanation: "A Taxonomy is the structured classification scheme this Knowledge Area uses to organize content consistently, directly supporting findability across the organization."
why_incorrect:
  - option: "A"
    reason: "A Records Retention Schedule governs how long content is kept, not how it is classified for findability."
  - option: "C"
    reason: "A Legal Hold suspends normal disposition for litigation-relevant content, unrelated to general classification for findability."
  - option: "D"
    reason: "A Data Contract is a Data Integration and Interoperability concept specifying interface schema/semantics between systems, unrelated to content taxonomy."
