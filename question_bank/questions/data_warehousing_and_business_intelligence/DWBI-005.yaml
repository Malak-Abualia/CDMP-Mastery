question_type: "Multiple Choice"
stem: "OLAP (Online Analytical Processing) is best described as:"
answer_choices:
  - "A) A system or technique optimized for fast, single-record transactions"
  - "B) A system or technique optimized for complex, multidimensional analytical queries"
  - "C) A synonym for ETL"
  - "D) A specific type of data mart"
correct_answer: "B"
explanation: "OLAP describes systems and techniques optimized for complex, multidimensional analytical queries — aggregating, comparing, and slicing data across many dimensions at once."
why_incorrect:
  - option: "A"
    reason: "This describes OLTP (Online Transactional Processing), OLAP's direct counterpart, not OLAP itself."
  - option: "C"
    reason: "ETL is a data-loading pattern; OLAP is an analytical query processing concept — the two are unrelated categories."
  - option: "D"
    reason: "OLAP is a processing/technique concept, not a specific store type like a data mart."
