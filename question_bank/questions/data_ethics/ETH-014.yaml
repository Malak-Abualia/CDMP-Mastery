keywords: ["data ownership", "individual control", "access and deletion rights"]
estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A company designs its systems so users can view, correct, and request deletion of their own personal data at any time, rather than defaulting to organizational control with no user-facing mechanism. What ethical principle does this design most directly reflect?"
answer_choices:
  - "A) Data Minimization"
  - "B) The ownership/control principle — deliberately returning meaningful control over personal data to the individuals it concerns, rather than defaulting to maximal organizational control"
  - "C) Proxy discrimination avoidance"
  - "D) The Belmont Report's Beneficence principle exclusively"
correct_answer: "B"
explanation: "Providing individuals meaningful access, correction, and deletion rights over their own data is a direct, practical application of the ownership/control ethical principle, which treats individual control as a deliberate design choice rather than a default ceded entirely to the organization."
why_incorrect:
  - option: "A"
    reason: "Data Minimization concerns how much data is collected/retained in the first place, not the individual's ability to control data already held."
  - option: "C"
    reason: "Proxy discrimination concerns disparate model outcomes via correlated variables, unrelated to individual data access/control rights."
  - option: "D"
    reason: "While Beneficence is broadly related, this design most specifically and directly reflects the ownership/control principle rather than the harm-minimization framing of Beneficence alone."
