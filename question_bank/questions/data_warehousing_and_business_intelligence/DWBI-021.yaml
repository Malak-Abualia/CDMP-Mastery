question_type: "Multiple Choice"
stem: "A Data Vault-style integration layer is built from three core structures. Which of the following correctly identifies them?"
answer_choices:
  - "A) Fact, Dimension, Bridge"
  - "B) Hub (business keys), Link (relationships between hubs), Satellite (descriptive, time-stamped attributes)"
  - "C) Staging, Presentation, Semantic"
  - "D) Policy, Standard, Procedure"
correct_answer: "B"
explanation: "Data Vault (associated with Dan Linstedt) is built from three structures: Hubs holding business keys, Links capturing relationships between hubs, and Satellites holding descriptive, time-stamped attributes — designed for high auditability and resilience to source-system change."
why_incorrect:
  - option: "A"
    reason: "Fact, Dimension, and Bridge are Kimball dimensional-modeling vocabulary, a different modeling approach with a different structural vocabulary entirely."
  - option: "C"
    reason: "Staging, Presentation, and Semantic are DW/BI pipeline layers (landing zone, query-ready structure, business-term abstraction), not Data Vault's specific internal structures."
  - option: "D"
    reason: "Policy, Standard, and Procedure are the Data Governance artifact hierarchy, unrelated to Data Vault modeling."
