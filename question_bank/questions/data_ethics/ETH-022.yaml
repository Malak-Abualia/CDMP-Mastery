question_type: "Multiple Choice"
stem: "Which role is specifically responsible for evaluating high-impact data initiatives against ethical principles, not only legal compliance?"
answer_choices:
  - "A) Data Custodian"
  - "B) Data Ethicist / Ethics Officer"
  - "C) Database Administrator"
  - "D) Records Manager"
correct_answer: "B"
explanation: "The Data Ethicist / Ethics Officer role (formal or distributed across existing governance roles in smaller organizations) is specifically responsible for evaluating high-impact data initiatives against ethical principles, not only legal compliance."
why_incorrect:
  - option: "A"
    reason: "A Data Custodian implements technical controls that others decide are necessary; it does not evaluate whether a data use is ethically appropriate."
  - option: "C"
    reason: "A Database Administrator is a technical/operational role unrelated to ethical evaluation."
  - option: "D"
    reason: "A Records Manager is a Document and Content Management role focused on records classification and retention, not ethical evaluation."
