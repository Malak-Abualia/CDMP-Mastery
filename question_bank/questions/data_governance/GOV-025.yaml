question_type: "Scenario-Based"
stem: "A European e-commerce retailer must comply with GDPR's requirements around lawful basis for processing and the right to erasure. According to DAMA's framing, what is the correct governance mechanism for translating this external regulatory obligation into something Data Engineers can implement consistently?"
answer_choices:
  - "A) Individual engineers should independently interpret GDPR requirements as they build each pipeline"
  - "B) Governance translates the regulatory obligation into organizational Policy, then Standards and Procedures that engineers implement"
  - "C) The Data Protection Officer alone implements GDPR technically, bypassing governance entirely"
  - "D) GDPR compliance is a one-time technical project, not an ongoing governance concern"
correct_answer: "B"
explanation: "DAMA frames governance as the structure through which regulatory obligations get translated into concrete organizational policy — exactly the Policy → Standard → Procedure mechanism: a Policy stating PII must be handled per GDPR, a Standard specifying the measurable requirement (e.g., an erasure-request SLA), and a Procedure telling an engineer exactly how to comply."
why_incorrect:
  - option: "A"
    reason: "This recreates the exact accountability gap DAMA warns against — engineers should not independently interpret regulatory or business decisions on their own."
  - option: "C"
    reason: "This frames GDPR compliance as a purely technical, compliance-function task, contradicting governance's cross-functional, business-led framing."
  - option: "D"
    reason: "This contradicts governance's framing as an ongoing program, not a one-time project — regulatory obligations require sustained oversight as data and processes evolve."
