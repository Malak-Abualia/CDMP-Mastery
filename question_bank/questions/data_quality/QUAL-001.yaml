question_type: "Multiple Choice"
stem: "What does the Accuracy data quality dimension measure?"
answer_choices:
  - "A) Whether data conforms to a required format or business rule"
  - "B) The degree to which data correctly describes the real-world object or event it represents"
  - "C) Whether all required data is present"
  - "D) Whether data is available within an expected time window"
correct_answer: "B"
explanation: "Accuracy measures the degree to which data correctly describes the real-world object or event it represents — for example, a customer's address on file matching their actual current residence."
why_incorrect:
  - option: "A"
    reason: "Conformance to format or business rule describes Validity, not Accuracy."
  - option: "C"
    reason: "The presence of all required data describes Completeness, not Accuracy."
  - option: "D"
    reason: "Availability within an expected time window describes Timeliness, not Accuracy."
