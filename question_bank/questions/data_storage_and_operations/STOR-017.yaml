learning_objective: "Evaluate legitimate technical reasons for choosing a column-family database over a relational database, as distinct from a preference-driven choice."
dama_concept: null
industry_practice_concept: "Column-family database"
keywords: ["column-family database", "NoSQL", "workload fit", "write throughput"]
estimated_solving_time: 75
question_type: "Multiple Select"
stem: "Select the two considerations below that most legitimately favor choosing a column-family NoSQL database over a relational database for a new system. (Select two.)"
answer_choices:
  - "A) The workload requires very high write throughput across a wide, sparse dataset that doesn't fit a rigid, densely populated table structure well"
  - "B) The team wants to avoid learning SQL"
  - "C) The data has a genuinely sparse, wide-column structure where most records populate only a small, varying subset of possible columns"
  - "D) A column-family database is newer technology and therefore assumed to be a strict upgrade"
correct_answer: ["A", "C"]
explanation: "High write throughput against a wide, sparse dataset, and a genuinely sparse wide-column data shape, are both legitimate workload-driven reasons a column-family store may be a better structural fit than a relational schema."
why_incorrect:
  - option: "B"
    reason: "Avoiding a particular query language is a personal/team preference, not a legitimate workload-driven architectural justification."
  - option: "D"
    reason: "Assuming newer technology is automatically superior is a documented anti-pattern in this Knowledge Area — technology selection must be workload-driven, not recency-driven."
