question_type: "Multiple Select"
stem: "Which of the following statements about 'Single Source of Truth' are accurate? (Select all that apply.)"
answer_choices:
  - "A) It is a governance/authority concept describing which data is trusted, not a physical storage requirement"
  - "B) It always requires all data to physically reside in one database"
  - "C) A Registry-style MDM implementation can achieve it without physically consolidating data"
  - "D) It concerns an agreement about which record or process is treated as correct when values disagree"
correct_answer: ["A", "C", "D"]
explanation: "A, C, and D correctly reflect that Single Source of Truth is about governed authority, not physical consolidation — a Registry-style implementation is a direct real-world proof of this, since it achieves a trusted single view via a virtual, computed layer."
why_incorrect:
  - option: "B"
    reason: "This is the specific misconception DAMA content warns against — Single Source of Truth does not require physical consolidation into one database."
