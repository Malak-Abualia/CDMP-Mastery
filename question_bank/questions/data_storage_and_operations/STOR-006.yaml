estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A system backs up every 12 hours and can be restored from backup within 20 minutes once a failure is detected. The business has approved an RPO of 1 hour for this system. What is the most accurate assessment?"
answer_choices:
  - "A) The system meets both its RPO and RTO targets"
  - "B) The system's RTO is likely acceptable, but its backup frequency does not support the approved 1-hour RPO"
  - "C) RPO and RTO cannot both be evaluated unless the system has zero downtime"
  - "D) The 12-hour backup frequency has no bearing on RPO, only on RTO"
correct_answer: "B"
explanation: "A 12-hour backup interval means up to 12 hours of data could be lost in a failure, far exceeding the approved 1-hour RPO, even though the 20-minute restore time suggests a reasonably strong RTO capability."
why_incorrect:
  - option: "A"
    reason: "The backup frequency directly implies up to 12 hours of potential data loss, which does not meet a 1-hour RPO target."
  - option: "C"
    reason: "RPO and RTO can and should be evaluated independently regardless of whether downtime is zero."
  - option: "D"
    reason: "Backup frequency is precisely the factor that determines how much data could be lost, which is exactly what RPO measures."
