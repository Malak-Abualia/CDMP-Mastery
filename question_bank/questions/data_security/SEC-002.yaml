question_type: "Multiple Choice"
stem: "What is Authorization?"
answer_choices:
  - "A) The process of verifying that a party is who or what it claims to be"
  - "B) The process of determining what an authenticated party is permitted to do"
  - "C) The irreversible removal of identifying information from a dataset"
  - "D) The recording of who accessed what data and when"
correct_answer: "B"
explanation: "Authorization is the process of determining what an already-authenticated party is permitted to do, answering 'what are you allowed to do now that we know who you are.'"
why_incorrect:
  - option: "A"
    reason: "This describes Authentication, a distinct, prior process."
  - option: "C"
    reason: "This describes Anonymization, a data protection technique, not a permission-determination process."
  - option: "D"
    reason: "This describes Access Logging, a monitoring practice, not the determination of what is permitted."
