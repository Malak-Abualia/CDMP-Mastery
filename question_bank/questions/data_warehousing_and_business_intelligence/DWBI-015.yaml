estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "An organization gives every analyst direct self-service access to raw warehouse tables, with no shared semantic layer or conformed dimensions. Within a year, three different self-service reports show three different 'Active Customer' counts. What is the most likely root cause?"
answer_choices:
  - "A) Self-service BI tools are inherently unreliable and should not be used"
  - "B) Without a governed semantic layer, each analyst independently defined the metric, recreating the fragmented-reporting problem this Knowledge Area exists to solve"
  - "C) The warehouse itself has silently become an Operational Data Store"
  - "D) The analysts used ETL instead of ELT to build their reports"
correct_answer: "B"
explanation: "Self-service BI removes the IT bottleneck but, without a governed semantic layer and conformed dimensions, also removes the structural consistency guarantee, letting each analyst's report silently diverge on shared metric definitions."
why_incorrect:
  - option: "A"
    reason: "This overgeneralizes a governance gap into a blanket condemnation of the tooling category itself; the tool is not inherently the problem."
  - option: "C"
    reason: "Whether the warehouse is an ODS or a Data Warehouse is unrelated to why self-service reports disagree on a metric definition."
  - option: "D"
    reason: "ETL vs. ELT is an unrelated data-loading ordering choice, not the cause of definitional inconsistency across self-service reports."
