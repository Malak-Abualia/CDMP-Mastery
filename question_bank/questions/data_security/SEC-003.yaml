question_type: "Multiple Choice"
stem: "What is the purpose of Data Classification?"
answer_choices:
  - "A) To determine which database technology is most performant"
  - "B) To categorize data according to its sensitivity, criticality, or regulatory requirements, driving the level of protection required"
  - "C) To physically move infrequently accessed data to cheaper storage"
  - "D) To verify a user's identity before granting system access"
correct_answer: "B"
explanation: "Data Classification categorizes data by sensitivity, criticality, or regulatory requirement, which in turn drives what level of protection (access control, encryption) it requires."
why_incorrect:
  - option: "A"
    reason: "Database technology performance is a Data Storage and Operations concern, unrelated to classification."
  - option: "C"
    reason: "This describes Storage Tiering, a Data Storage and Operations lifecycle concept, not classification."
  - option: "D"
    reason: "This describes Authentication, a distinct access-control process."
