question_type: "Multiple Choice"
stem: "What is Big Data?"
answer_choices:
  - "A) The multidisciplinary practice of extracting insight and building predictive capability from data"
  - "B) Datasets whose volume, velocity, and/or variety exceed the practical capacity of traditional data management tools and techniques"
  - "C) A large-scale repository holding raw data in its native format"
  - "D) A model that learns patterns from data rather than being explicitly programmed"
correct_answer: "B"
explanation: "Big Data describes datasets whose volume, velocity, and/or variety exceed traditional data management tools' practical capacity."
why_incorrect:
  - option: "A"
    reason: "This describes Data Science, a distinct analytical discipline that can be applied to data of any size."
  - option: "C"
    reason: "This describes a Data Lake, a specific storage pattern often used for big data, not Big Data itself."
  - option: "D"
    reason: "This describes Machine Learning, a data science technique, not the data characteristics Big Data describes."
