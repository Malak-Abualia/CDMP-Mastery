estimated_solving_time: 75
question_type: "Multiple Select"
stem: "Which of the following are documented, legitimate reasons a data governance program can lose organizational support over time? (Select all that apply.)"
answer_choices:
  - "A) The program shows no measurable business value or metrics"
  - "B) Governance approval requirements are so heavyweight that teams route around them via shadow IT"
  - "C) The program attempted to govern all enterprise data simultaneously rather than starting with high-value domains"
  - "D) The program successfully resolved a cross-departmental definition dispute"
correct_answer: ["A", "B", "C"]
explanation: "A, B, and C are all documented common-mistake patterns that erode governance sponsorship — no demonstrated value, bureaucratic overreach causing avoidance, and unfocused scope that stalls under its own weight."
why_incorrect:
  - option: "D"
    reason: "This describes governance functioning correctly (successful issue escalation and resolution), which strengthens rather than weakens organizational support."
