question_type: "Multiple Choice"
stem: "What does 'Availability' mean in the context of Data Storage and Operations?"
answer_choices:
  - "A) The total volume of data a system can store"
  - "B) The proportion of time a data asset or system is accessible and operational when needed, typically expressed as an SLA"
  - "C) The number of database technology types an organization supports"
  - "D) The speed at which a query returns results"
correct_answer: "B"
explanation: "Availability is the proportion of time a data asset or system is accessible and operational when needed, typically expressed as a Service Level Agreement (e.g., '99.9% uptime')."
why_incorrect:
  - option: "A"
    reason: "This describes storage capacity, unrelated to whether a system is accessible when needed."
  - option: "C"
    reason: "Technology diversity is unrelated to the definition of availability."
  - option: "D"
    reason: "This describes query performance, a related but distinct concern from availability."
