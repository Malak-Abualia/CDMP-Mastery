question_type: "Scenario-Based"
stem: "A contract's standard retention period would have expired and triggered destruction 18 months ago, but the contract has been under an active Legal Hold for the past 2 years due to related litigation. The litigation concludes and Legal formally lifts the hold. What should happen to the contract's retention status immediately after the hold is lifted?"
answer_choices:
  - "A) The contract must be destroyed immediately, since its standard retention period expired 18 months ago"
  - "B) The contract reverts to its normal Records Retention Schedule governance, and disposition proceeds according to that schedule now that the overriding hold no longer applies"
  - "C) The contract must be retained permanently, since it was once under a Legal Hold"
  - "D) The contract's retention status is unaffected by the hold being lifted"
correct_answer: "B"
explanation: "Once a Legal Hold is lifted, the content reverts to governance under its normal Records Retention Schedule — since that schedule's period had already elapsed during the hold, disposition would now appropriately proceed under the schedule's normal rules, rather than being either destroyed as an automatic reflex or retained forever."
why_incorrect:
  - option: "A"
    reason: "Immediate, automatic destruction the instant a hold lifts skips the appropriate governed disposition process and review that should follow, rather than treating disposition as a reflexive action."
  - option: "C"
    reason: "Having once been under a Legal Hold does not convert a record into a permanently retained item — the hold is temporary and tied to the specific litigation, not a permanent retention escalation."
  - option: "D"
    reason: "The hold being lifted is precisely what restores the normal Records Retention Schedule's governance, a meaningful change in the record's status, not a non-event."
