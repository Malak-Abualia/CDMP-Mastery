question_type: "Multiple Choice"
stem: "An insurance company's Customer entity is named 'cust' in the policy admin system, 'client' in the CRM, and 'Customers' in the claims system, with no governed naming standard in place. What does DMBOK2 identify as the underlying discipline gap this reflects?"
answer_choices:
  - "A) A Data Modeling problem with a Data Governance solution — naming standards approved as governance Standards"
  - "B) A purely Database Design / performance-tuning issue"
  - "C) An unavoidable consequence of using multiple systems that no governance process can address"
  - "D) A Data Quality Uniqueness violation"
correct_answer: "A"
explanation: "DMBOK2 frames inconsistent naming across systems as a Data Modeling problem with a Data Governance solution — naming standards are typically approved through the Policy → Standard → Procedure hierarchy, directly linking Data Modeling and Data Governance rather than being an engineering-only concern."
why_incorrect:
  - option: "B"
    reason: "Naming inconsistency is a modeling/governance discipline gap, not a performance-tuning or indexing concern."
  - option: "C"
    reason: "DAMA explicitly frames this as solvable through governed naming standards, not as an unavoidable tax of operating multiple systems."
  - option: "D"
    reason: "Uniqueness (a Data Quality dimension) concerns duplicate entity instances within a dataset, not inconsistent naming of the same concept across systems."
