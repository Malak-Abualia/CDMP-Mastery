question_type: "Multiple Choice"
stem: "What is a Legal Hold (Litigation Hold)?"
answer_choices:
  - "A) A permanent ban on ever deleting any organizational content"
  - "B) A directive suspending an item's normal retention/destruction schedule because it may be relevant to actual or reasonably anticipated litigation or investigation"
  - "C) A structured classification scheme for organizing content"
  - "D) A search index used to locate records quickly"
correct_answer: "B"
explanation: "A Legal Hold suspends an item's normal retention/destruction schedule specifically because it may be relevant to actual or reasonably anticipated litigation or a regulatory investigation, until the hold is formally lifted."
why_incorrect:
  - option: "A"
    reason: "A Legal Hold is scoped to specific relevant content and is lifted once the legal need ends, not a permanent, organization-wide deletion ban."
  - option: "C"
    reason: "This describes a Taxonomy, a distinct organizational concept."
  - option: "D"
    reason: "This describes search/retrieval infrastructure, an unrelated retrieval mechanism."
