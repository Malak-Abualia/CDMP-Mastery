estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "How do ISO 15489 and Dublin Core differ in scope?"
answer_choices:
  - "A) They are the same standard published under two different names"
  - "B) ISO 15489 covers records management principles (system design, classification, retention/disposition); Dublin Core provides a standard set of descriptive metadata elements for describing content"
  - "C) ISO 15489 governs website content; Dublin Core governs payment card data"
  - "D) Dublin Core is a legal regulation; ISO 15489 is a voluntary industry guideline with no formal standardization body"
correct_answer: "B"
explanation: "ISO 15489 is the international standard for records management principles, while Dublin Core is a separate, widely-adopted set of descriptive metadata elements (title, creator, date, subject) for describing content — related but distinct in scope."
why_incorrect:
  - option: "A"
    reason: "They are two distinct, independently published standards addressing different concerns (records management principles vs. descriptive metadata elements)."
  - option: "C"
    reason: "Neither standard governs website content or payment card data; this misattributes both standards' actual scope."
  - option: "D"
    reason: "Both are real, formally published standards (ISO 15489 and ISO 15836/Dublin Core), not one regulation and one informal guideline."
