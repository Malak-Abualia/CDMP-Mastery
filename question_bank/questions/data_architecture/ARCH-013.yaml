question_type: "Multiple Select"
stem: "TOGAF formally decomposes Enterprise Architecture into four domains. Which four are they? (Select all that apply.)"
answer_choices:
  - "A) Business Architecture"
  - "B) Data Architecture"
  - "C) Application Architecture"
  - "D) Technology Architecture"
  - "E) Data Governance Architecture"
correct_answer: ["A", "B", "C", "D"]
explanation: "TOGAF's four domains are Business, Data, Application, and Technology Architecture. 'Data Governance Architecture' is not one of TOGAF's four domains — Data Governance is a distinct DAMA Knowledge Area, not a TOGAF domain."
why_incorrect:
  - option: "E"
    reason: "This is not one of TOGAF's four domains — it conflates a DAMA Knowledge Area (Data Governance) with TOGAF's architecture decomposition."
