estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "A Data Engineer implementing encryption and access controls for a PII-classified table, based on a classification decision made elsewhere, is acting in which DAMA role?"
answer_choices:
  - "A) Data Owner"
  - "B) Data Steward"
  - "C) Data Custodian"
  - "D) Governance Council member"
correct_answer: "C"
explanation: "Custodians implement the technical controls that Owners and Stewards decide are necessary; they execute decisions rather than making classification or access-policy decisions themselves."
why_incorrect:
  - option: "A"
    reason: "The Owner sets accountable policy and definitions, not routine technical implementation."
  - option: "B"
    reason: "The Steward maintains business rules and definitions — a step above pure technical execution."
  - option: "D"
    reason: "The Council resolves escalated disputes and sets policy at a senior cross-functional level, not hands-on implementation."
