question_type: "Multiple Select"
stem: "Three matched source records disagree on a customer's Legal Name and Phone Number. A Steward is designing survivorship rules for each attribute. Which of the following design choices are well-reasoned? (Select all that apply.)"
answer_choices:
  - "A) Use source priority for Legal Name, designating a system where identity is formally verified (e.g., the CRM or core banking system) as authoritative"
  - "B) Use recency for Phone Number, since contact information genuinely changes over time and the most recently confirmed value is often most current"
  - "C) Apply the exact same single rule to every attribute regardless of its behavior, for simplicity"
  - "D) Allow the rule choice for each attribute to be justified by that attribute's actual behavior, rather than a one-size-fits-all default"
correct_answer: ["A", "B", "D"]
explanation: "A, B, and D reflect sound survivorship design: identity attributes (like Legal Name) benefit from source-priority rules tied to verification authority, while contact attributes (like Phone Number) often behave better under recency-based rules, and the overall design principle is to justify each rule by the attribute's real behavior."
why_incorrect:
  - option: "C"
    reason: "Applying one blanket rule to every attribute ignores that different attributes (identity vs. contact information) behave very differently, and is explicitly the wrong approach per DAMA-aligned survivorship design."
