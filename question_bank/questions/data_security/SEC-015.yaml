estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Who should be accountable for approving the classification level of a given data domain?"
answer_choices:
  - "A) The IT Security team, unilaterally, without business input"
  - "B) The accountable Data Owner for that domain"
  - "C) Whichever team requests access most frequently"
  - "D) The database vendor providing the underlying platform"
correct_answer: "B"
explanation: "Classification is a governed, business-impact-driven decision belonging to the accountable Data Owner for the domain; Data Security defines and enforces the technical/procedural controls, but the Owner decides the appropriate sensitivity level."
why_incorrect:
  - option: "A"
    reason: "IT/Security unilaterally deciding classification without business input recreates the documented accountability gap this Knowledge Area explicitly warns against."
  - option: "C"
    reason: "Access frequency is unrelated to a data domain's actual sensitivity and is not a valid basis for classification authority."
  - option: "D"
    reason: "The platform vendor has no accountability for the organization's own governance decisions about data sensitivity."
