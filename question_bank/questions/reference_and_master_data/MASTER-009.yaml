question_type: "Scenario-Based"
stem: "An MDM implementation maintains a centralized golden record and actively synchronizes changes back to source systems in near-real time, while source systems retain some local autonomy. Which MDM implementation style is this?"
answer_choices:
  - "A) Registry"
  - "B) Consolidation"
  - "C) Coexistence"
  - "D) Centralized"
correct_answer: "C"
explanation: "Coexistence is similar to Consolidation in that a centralized golden record is built and maintained, but it actively synchronizes back to source systems bidirectionally, keeping local systems' data updated — a practical middle ground between Registry's minimal intervention and Centralized's full control."
why_incorrect:
  - option: "A"
    reason: "Registry stores only cross-reference keys with no physical golden record, unlike the centralized, synchronized record described here."
  - option: "B"
    reason: "Consolidation builds a centralized golden record for reporting but does not synchronize changes back to source systems."
  - option: "D"
    reason: "Centralized eliminates local source-system autonomy entirely, making the golden record the sole system of record — the scenario explicitly describes retained local autonomy."
