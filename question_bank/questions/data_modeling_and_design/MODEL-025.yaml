estimated_solving_time: 85
question_type: "Scenario-Based"
stem: "A cloud-native retail platform's Order service publishes 'OrderPlaced' events directly from its internal database schema, with no separate review step before downstream consumers (billing, fulfillment) begin depending on the event's structure. A recent field rename broke three consuming services with no warning. From a Data Modeling perspective, what discipline gap does this most directly illustrate?"
answer_choices:
  - "A) The event schema functions as a physical model with no preceding logical model or review — a documented Data Modeling anti-pattern in schema-first / event-driven contexts"
  - "B) This is purely a Data Integration problem, unrelated to modeling"
  - "C) The team correctly followed DAMA's recommended agile modeling approach"
  - "D) This indicates a Data Storage and Operations backup failure"
correct_answer: "A"
explanation: "DMBOK2-aligned practice treats a schema registry entry (an event schema) as a physical model — when built with no preceding logical model or review, breaking changes are only caught by consumers failing at runtime rather than by a reviewed model change, exactly the 'skipping levels of abstraction' mistake this Knowledge Area exists to prevent. A formal Data Contract is the modern, enforced instantiation of the missing logical-model discipline."
why_incorrect:
  - option: "B"
    reason: "While this has real Data Integration and Interoperability consequences, the root discipline gap described is specifically a modeling one — collapsing all levels of abstraction into an unreviewed physical artifact."
  - option: "C"
    reason: "DMBOK2 does not endorse skipping logical review; an iterative modeling process still requires the levels to exist and be reviewed, just not as three separate sequential projects."
  - option: "D"
    reason: "The scenario describes a schema-change/review gap, unrelated to backup or recovery capability."
