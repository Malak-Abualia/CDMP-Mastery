estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "In the Data Quality Management lifecycle, what should happen immediately after identifying a quality issue?"
answer_choices:
  - "A) Deploy a monitoring dashboard"
  - "B) Analyze root causes"
  - "C) Cleanse the data"
  - "D) Notify the Governance Council only, with no further action"
correct_answer: "B"
explanation: "The DQM lifecycle moves from identifying issues to analyzing root causes — investigating why an issue occurs — before moving to sustainable process improvement; skipping straight to cleansing treats the symptom without addressing the cause."
why_incorrect:
  - option: "A"
    reason: "Monitoring is the lifecycle's final, ongoing step, confirming improvements hold — it does not come immediately after issue identification."
  - option: "C"
    reason: "Cleansing without root-cause analysis first is a documented anti-pattern — it just repeats the same manual effort indefinitely."
  - option: "D"
    reason: "Notification alone with no root-cause investigation does not advance the lifecycle toward a sustainable fix."
