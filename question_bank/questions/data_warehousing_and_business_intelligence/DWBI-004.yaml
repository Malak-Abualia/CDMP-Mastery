dama_concept: "ETL (Extract, Transform, Load)"
industry_practice_concept: null
keywords: ["ETL", "extract", "transform", "load"]
estimated_solving_time: 20
question_type: "Multiple Choice"
stem: "In the ETL pattern, in what order do the three steps occur?"
answer_choices:
  - "A) Load, Extract, Transform"
  - "B) Extract, Load, Transform"
  - "C) Extract, Transform, Load"
  - "D) Transform, Extract, Load"
correct_answer: "C"
explanation: "ETL stands for Extract, Transform, Load — data is extracted from source systems, transformed in a separate processing layer, and only then loaded into the warehouse in its final form."
why_incorrect:
  - option: "A"
    reason: "This ordering is not a recognized DW/BI loading pattern."
  - option: "B"
    reason: "This ordering describes ELT (Extract, Load, Transform), the reversed-ordering variant, not ETL."
  - option: "D"
    reason: "Transformation cannot occur before extraction, since there is no data yet to transform."
