stem: "What is a Maturity Model?"
answer_choices:
  - "A) A structured framework defining discrete levels describing how capable, consistent, and institutionalized a practice is"
  - "B) A single numeric score summarizing an entire organization's data management"
  - "C) A list of database technologies ranked by performance"
  - "D) A schedule specifying how long records must be retained"
correct_answer: "A"
explanation: "A Maturity Model is a structured framework defining discrete levels (typically from ad hoc through optimized) describing how capable and institutionalized a given practice is."
why_incorrect:
  - option: "B"
    reason: "DAMA's approach explicitly avoids a single blended organizational score, assessing per Knowledge Area instead."
  - option: "C"
    reason: "This describes an unrelated technology comparison, not a maturity framework."
  - option: "D"
    reason: "This describes a Records Retention Schedule, a Document and Content Management concept."
