estimated_solving_time: 70
question_type: "Scenario-Based"
stem: "A Data Engineer, worried about being blamed for data loss, configures a production database to retain all historical records indefinitely, overriding the organization's documented 3-year retention policy, without informing the Data Owner or compliance. Six months later, an audit flags the organization for retaining regulated data well beyond its disclosed policy. What is the most accurate diagnosis?"
answer_choices:
  - "A) The Data Engineer made a reasonable, low-risk technical choice, and the audit finding is an overreaction"
  - "B) The Data Engineer overstepped the Custodian role's boundary by unilaterally overriding a governed retention policy, creating real compliance exposure"
  - "C) The audit finding is invalid, since retaining more data is never a compliance risk"
  - "D) This is solely a technical configuration bug, unrelated to governance"
correct_answer: "B"
explanation: "Retention policy is a governed decision belonging to the Data Owner (in consultation with compliance/legal); a Data Engineer unilaterally overriding the documented policy — even with good intentions — creates real compliance exposure by retaining regulated data beyond what the organization has disclosed and is authorized to keep."
why_incorrect:
  - option: "A"
    reason: "This dismisses a real, documented compliance exposure created by exceeding the disclosed and approved retention period."
  - option: "C"
    reason: "Retaining regulated data beyond its approved policy is precisely a compliance risk, as the audit finding in the scenario confirms."
  - option: "D"
    reason: "While there is a technical configuration involved, the root cause is a governance boundary violation — an unauthorized override of a business-approved policy — not merely a technical bug."
