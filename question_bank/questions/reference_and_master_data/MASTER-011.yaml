estimated_solving_time: 45
question_type: "Multiple Choice"
stem: "A company models both individual customers and corporate customers under a single 'Party' supertype, with 'Person' and 'Organization' as subtypes. Which Master Data type category does this represent?"
answer_choices:
  - "A) Product"
  - "B) Financial"
  - "C) Party"
  - "D) Location"
correct_answer: "C"
explanation: "Party is the Master Data type covering people and organizations the enterprise has relationships with — customers, employees, suppliers, partners — frequently modeled with a Party supertype and Person/Organization subtypes, directly applying the Generalization/Subtyping pattern from Data Modeling."
why_incorrect:
  - option: "A"
    reason: "Product covers the goods/services the enterprise sells or produces, unrelated to people/organization entities."
  - option: "B"
    reason: "Financial covers accounts, cost centers, and chart-of-accounts entities, not people or organizations."
  - option: "D"
    reason: "Location covers physical or logical places, such as sites or warehouses, not people or organizations."
