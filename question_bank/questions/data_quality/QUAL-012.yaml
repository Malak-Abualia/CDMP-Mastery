estimated_solving_time: 50
question_type: "Multiple Select"
stem: "Which of the following statements correctly describe the relationship between Data Cleansing and Data Quality Management (DQM)? (Select all that apply.)"
answer_choices:
  - "A) Cleansing is one remediation activity within the broader, ongoing DQM discipline"
  - "B) Cleansing replaces the need for DQM entirely"
  - "C) Cleansing without root-cause analysis tends to require repeating the same manual effort indefinitely"
  - "D) DQM is a continuous management discipline, while cleansing is typically reactive"
correct_answer: ["A", "C", "D"]
explanation: "A, C, and D correctly reflect that cleansing is a component activity within the broader DQM discipline, and that cleansing without addressing root causes just recreates the same recurring problem."
why_incorrect:
  - option: "B"
    reason: "This treats a one-time remediation activity as a substitute for an ongoing management discipline, which directly contradicts DAMA's explicit framing and is a documented exam trap."
