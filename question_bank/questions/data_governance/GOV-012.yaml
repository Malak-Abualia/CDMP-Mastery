question_type: "Multiple Select"
stem: "Which of the following statements correctly reflect DAMA's Governance vs. Management distinction? (Select all that apply.)"
answer_choices:
  - "A) Governance sets policy and assigns decision rights; Management executes operationally"
  - "B) Governance and Management are the same activity performed by different teams"
  - "C) A Data Owner exercises governance-level accountability; a Data Custodian performs management-level execution"
  - "D) Governance decisions should never be made by IT alone, since governance is business-led and cross-functional"
correct_answer: ["A", "C", "D"]
explanation: "A, C, and D all correctly reflect DAMA's explicit governance/management split and its business-led, cross-functional framing."
why_incorrect:
  - option: "B"
    reason: "This directly contradicts DMBOK2's explicit distinction between the two concepts — the core exam trap of this Knowledge Area."
