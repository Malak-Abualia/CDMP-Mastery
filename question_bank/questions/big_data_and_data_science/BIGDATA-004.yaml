stem: "What is Model Drift?"
answer_choices:
  - "A) The degradation of a deployed model's accuracy over time as real-world conditions diverge from what the training data reflected"
  - "B) A model learning training data's specific noise rather than the general underlying pattern"
  - "C) The process of splitting data into training, validation, and test subsets"
  - "D) A governance artifact documenting data sharing terms"
correct_answer: "A"
explanation: "Model Drift is the degradation of a deployed model's accuracy over time as real-world conditions diverge from its training data, requiring ongoing monitoring and periodic retraining."
why_incorrect:
  - option: "B"
    reason: "This describes Overfitting, a training-time issue, not a post-deployment degradation over time."
  - option: "C"
    reason: "This describes the training/validation/test data split practice, unrelated to drift specifically."
  - option: "D"
    reason: "This describes a Data Sharing Agreement, a Data Integration and Interoperability governance artifact."
