estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A logistics company needs a store that reflects current shipment status across systems, refreshed every 15 minutes, primarily for dispatchers checking today's operations — not multi-year trend analysis. Which store type best fits this need?"
answer_choices:
  - "A) Data Warehouse"
  - "B) Operational Data Store"
  - "C) Independent Data Mart"
  - "D) OLAP Cube"
correct_answer: "B"
explanation: "An Operational Data Store is defined by exactly this pattern: integrated, current-state-focused, frequently refreshed, and used for operational rather than deep historical reporting."
why_incorrect:
  - option: "A"
    reason: "A Data Warehouse is time-variant with deep retained history, the opposite of this current-state, short-history focus."
  - option: "C"
    reason: "A data mart is defined by its subject-area scope, not by refresh frequency, and 'independent' specifically describes bypassing the warehouse, not current-state focus."
  - option: "D"
    reason: "An OLAP Cube is a multidimensional analytical structure, not the underlying integrated data store described here."
