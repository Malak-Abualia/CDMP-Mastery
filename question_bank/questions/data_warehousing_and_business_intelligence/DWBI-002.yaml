question_type: "Multiple Choice"
stem: "What is Business Intelligence (BI), as distinct from the Data Warehouse itself?"
answer_choices:
  - "A) The integration layer that combines raw source data into a single format"
  - "B) The tools, processes, and technologies that turn warehoused data into consumable insight"
  - "C) The physical database engine that hosts the warehouse"
  - "D) The governed business rules that resolve conflicting attribute values"
correct_answer: "B"
explanation: "Business Intelligence is the consumption/delivery layer — reporting, dashboards, and analytical tools that turn warehoused data into insight — distinct from the warehouse's own data structures."
why_incorrect:
  - option: "A"
    reason: "This describes ETL/ELT integration work, not the BI consumption layer."
  - option: "C"
    reason: "The physical database engine is infrastructure, not the definition of Business Intelligence."
  - option: "D"
    reason: "This describes Survivorship Rules, a Master Data Management concept, unrelated to BI."
