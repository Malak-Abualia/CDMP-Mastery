question_type: "Multiple Choice"
stem: "What is the primary purpose of normalization in data modeling?"
answer_choices:
  - "A) To improve read performance for analytical queries"
  - "B) To eliminate redundancy and update anomalies by structuring data according to normal forms"
  - "C) To convert a logical model directly into a physical model"
  - "D) To reduce the number of entities in a conceptual model"
correct_answer: "B"
explanation: "Normalization structures a logical model to eliminate redundancy and update anomalies, expressed as normal forms (1NF, 2NF, 3NF, and the stricter BCNF)."
why_incorrect:
  - option: "A"
    reason: "Improving read performance is the goal of denormalization, the deliberate opposite tradeoff, typically applied in analytical/warehouse models."
  - option: "C"
    reason: "Normalization is a structuring principle applied within the logical model, not a conversion step to a physical model."
  - option: "D"
    reason: "Normalization concerns attribute and dependency structure, not the number of entities modeled."
