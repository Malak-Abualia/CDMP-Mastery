estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "An organization decides whether to run one centralized enterprise data warehouse, federated domain-specific data marts, or a warehouse layered on top of a data lake. At which architecture layer is this decision made?"
answer_choices:
  - "A) Conceptual Data Architecture"
  - "B) Logical Data Architecture"
  - "C) Physical Data Architecture"
  - "D) Data Modeling, not Data Architecture"
correct_answer: "C"
explanation: "Whether the organization has one centralized warehouse, federated marts, or a lake-plus-warehouse layering is a Physical Data Architecture decision — informed by Conceptual/Logical requirements about which domains need integrated cross-domain reporting, but ultimately a concrete platform choice."
why_incorrect:
  - option: "A"
    reason: "Conceptual Data Architecture identifies domains and their relationships, independent of the specific platform choice being made here."
  - option: "B"
    reason: "Logical Data Architecture defines technology-independent flows and canonical structures — this decision is specifically about concrete technology/platform choice, which is Physical."
  - option: "D"
    reason: "This is an enterprise-wide platform decision spanning multiple domains, not the structure of a single dataset, so it belongs to Data Architecture, not Data Modeling."
