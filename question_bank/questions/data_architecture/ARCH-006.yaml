estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A document describes the attributes, primary key, and relationships of a single 'Customer' entity. Which discipline does this document belong to?"
answer_choices:
  - "A) Data Architecture"
  - "B) Data Modeling"
  - "C) Data Storage and Operations"
  - "D) Data Security"
correct_answer: "B"
explanation: "A document scoped to one entity's structure — attributes, keys, relationships — is Data Modeling, even if the word 'architecture' were used loosely elsewhere; the deciding factor is scope (one subject area vs. enterprise-wide), not vocabulary."
why_incorrect:
  - option: "A"
    reason: "Data Architecture describes the enterprise-wide blueprint across many subject areas and systems, not a single entity's structure."
  - option: "C"
    reason: "Data Storage and Operations concerns database operational management, unrelated to entity structure documentation."
  - option: "D"
    reason: "Data Security concerns classification and access control, not entity structure."
