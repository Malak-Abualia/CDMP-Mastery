question_type: "Multiple Choice"
stem: "Who is specifically responsible for records classification, retention schedule maintenance, and disposition, as the records-specific counterpart to a Data Steward?"
answer_choices:
  - "A) The Data Engineer, exclusively"
  - "B) The Records Manager"
  - "C) Whichever department stores the most content"
  - "D) The content management platform vendor"
correct_answer: "B"
explanation: "The Records Manager is the role specifically focused on records classification, retention schedule maintenance, and disposition, functioning as the records-specific counterpart to the Data Steward role."
why_incorrect:
  - option: "A"
    reason: "A Data Engineer implements the technical systems enforcing retention/classification but does not exclusively own the records management responsibility itself."
  - option: "C"
    reason: "Content volume is unrelated to who holds records management accountability."
  - option: "D"
    reason: "A platform vendor provides technology, not the organization's own accountable records governance role."
