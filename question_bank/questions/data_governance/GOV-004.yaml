estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "In DAMA's governance artifact hierarchy, what is the correct order from most general/mandatory intent to most operational detail?"
answer_choices:
  - "A) Procedure → Standard → Policy"
  - "B) Standard → Policy → Procedure"
  - "C) Policy → Standard → Procedure"
  - "D) Policy → Procedure → Standard"
correct_answer: "C"
explanation: "Policy states high-level mandatory intent, Standard operationalizes it into a specific measurable requirement, and Procedure gives step-by-step instructions for compliance."
why_incorrect:
  - option: "A"
    reason: "This reverses the order entirely, starting from the most operational detail instead of the most general intent."
  - option: "B"
    reason: "A Standard exists to satisfy a Policy, so the Policy must be defined first."
  - option: "D"
    reason: "This places Procedure before the Standard it is meant to operationalize."
