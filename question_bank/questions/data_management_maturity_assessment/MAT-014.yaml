question_type: "Scenario-Based"
stem: "A hospital network's data quality assessment finds a fully documented, board-approved data validation standard for patient intake records — meeting the criteria for Level 3 (Defined) on paper. No one has yet verified whether intake staff actually follow the standard day to day. What is the most defensible next step before reporting a Level 3 maturity score?"
answer_choices:
  - "A) Report Level 3 immediately, since a documented, approved standard is the defining evidence for that level"
  - "B) Gather corroborating evidence — staff interviews, direct observation, intake-record artifact review — to confirm the documented standard is actually followed in practice before finalizing the score"
  - "C) Report Level 4, since a formally board-approved standard implies active measurement is already occurring"
  - "D) Skip assessing this Knowledge Area entirely, since documentation alone cannot be trusted"
correct_answer: "B"
explanation: "A documented, standardized process is necessary but not sufficient evidence of genuine adherence — the exact 'documented (Level 3) ≠ actually followed' trap this Knowledge Area explicitly warns against. Corroborating evidence (interviews, observation, artifact review) is what confirms the documented standard reflects real day-to-day practice before a score is finalized."
why_incorrect:
  - option: "A"
    reason: "This conflates documentation with adherence — the exact misconception this Knowledge Area exists to correct."
  - option: "C"
    reason: "This overstates what board approval demonstrates; reaching Level 4 requires demonstrated, ongoing quantitative measurement, not something a documented standard implies by itself."
  - option: "D"
    reason: "This is an overcorrection — the appropriate fix is better evidence-gathering, not abandoning assessment of the Knowledge Area."
