estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A QA team's test database is refreshed monthly with a full, unmasked copy of production data, including customer payment details, and is accessible to a broad group of contractors. What is the most direct concern this scenario represents?"
answer_choices:
  - "A) A Recovery Point Objective (RPO) violation"
  - "B) A Non-Production Environment Management failure, since sensitive production data is exposed in a lower-security environment without masking"
  - "C) An Availability SLA violation"
  - "D) A Storage Tiering misconfiguration"
correct_answer: "B"
explanation: "This is a textbook Non-Production Environment Management failure — sensitive production data has been copied into a lower-security environment without masking, exposing it to a broader, less-controlled audience than production's access controls would allow."
why_incorrect:
  - option: "A"
    reason: "RPO concerns data-loss tolerance during a failure, unrelated to unmasked data exposure in a test environment."
  - option: "C"
    reason: "Availability concerns system uptime, unrelated to this data exposure issue."
  - option: "D"
    reason: "Storage Tiering concerns moving data between cost/performance tiers, unrelated to masking or environment access control."
