estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "How does this Knowledge Area characterize the relationship between legal compliance and data ethics?"
answer_choices:
  - "A) Legal compliance and ethics are identical; anything legal is automatically ethical"
  - "B) Legal compliance is a floor, not a ceiling — a practice can be fully legal and still unethical"
  - "C) Ethics is a subset of legal compliance with no independent standards"
  - "D) Legal compliance is irrelevant once an ethics review has occurred"
correct_answer: "B"
explanation: "Legal compliance sets a mandatory minimum floor; ethical evaluation is a separate, often higher standard an organization holds itself to."
why_incorrect:
  - option: "A"
    reason: "This conflates two distinct standards, the central documented misconception in this Knowledge Area."
  - option: "C"
    reason: "Ethics is not a subset of law; it applies independent standards beyond legal requirements."
  - option: "D"
    reason: "Legal compliance remains a necessary floor even after ethics review — the two are complementary, not substitutes for one another."
