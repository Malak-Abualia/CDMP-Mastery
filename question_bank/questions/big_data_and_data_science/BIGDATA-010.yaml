estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A retailer wants to group its customers into similar segments based on purchasing behavior, without any predefined labels indicating which segment each customer belongs to. Which type of machine learning does this task represent?"
answer_choices:
  - "A) Supervised learning"
  - "B) Unsupervised learning"
  - "C) Feature engineering"
  - "D) Model drift monitoring"
correct_answer: "B"
explanation: "Finding patterns or structure (like customer segments) in data without labeled outcomes is precisely the definition of unsupervised learning."
why_incorrect:
  - option: "A"
    reason: "Supervised learning requires labeled historical examples with known correct outputs, which this scenario explicitly lacks."
  - option: "C"
    reason: "Feature Engineering is the process of transforming raw data into model input variables, a distinct step from the learning type itself."
  - option: "D"
    reason: "Model Drift monitoring concerns tracking a deployed model's accuracy over time, unrelated to this initial modeling task classification."
