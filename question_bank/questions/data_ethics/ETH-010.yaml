estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "An insurance pricing model never uses age directly but heavily weights a variable strongly correlated with age, producing systematically higher prices for a specific age group. What does this scenario best illustrate?"
answer_choices:
  - "A) The model is fully fair, since age was never used as a direct input"
  - "B) Proxy discrimination — a facially neutral variable functioning as an indirect substitute for a characteristic, producing disparate outcomes"
  - "C) A Recovery Time Objective (RTO) issue"
  - "D) A Data Masking failure"
correct_answer: "B"
explanation: "A variable that is not itself the prohibited/sensitive characteristic but is strongly correlated with it, producing disparate outcomes, is a textbook example of proxy discrimination."
why_incorrect:
  - option: "A"
    reason: "The absence of a directly used sensitive variable does not establish fairness when a strongly correlated proxy variable produces the same disparate effect — the documented exam trap this Knowledge Area warns against."
  - option: "C"
    reason: "RTO concerns recovery time after a system failure, unrelated to pricing fairness."
  - option: "D"
    reason: "Data Masking is a non-production data protection technique, unrelated to model fairness evaluation."
