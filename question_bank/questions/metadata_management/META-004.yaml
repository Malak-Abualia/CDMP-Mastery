stem: "What is Data Lineage?"
answer_choices:
  - "A) A governed collection of business term definitions"
  - "B) The traceable record of data's origin, movement, and transformation history"
  - "C) A searchable inventory of an organization's data assets"
  - "D) A database's physical partitioning scheme"
correct_answer: "B"
explanation: "Data Lineage is the traceable record of data's origin, movement, and transformation history — where it came from, what happened to it, and where it went — making impact analysis and audit proof possible."
why_incorrect:
  - option: "A"
    reason: "This describes a Business Glossary, a distinct Business Metadata artifact."
  - option: "C"
    reason: "This describes a Data Catalog, a searchable interface, not a transformation-history record."
  - option: "D"
    reason: "A partitioning scheme is Technical Metadata about physical structure, not lineage."
