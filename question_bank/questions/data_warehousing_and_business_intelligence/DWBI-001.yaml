estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "Which of the following best defines a Data Warehouse?"
answer_choices:
  - "A) A short-history, frequently refreshed store of current operational data"
  - "B) A subject-oriented, integrated, time-variant, non-volatile collection of data supporting management decision-making"
  - "C) A transient landing zone for raw extracted data prior to transformation"
  - "D) A single department's subset of enterprise reporting data"
correct_answer: "B"
explanation: "A Data Warehouse is defined by four classic characteristics: subject-oriented, integrated, time-variant, and non-volatile — organized to support management decision-making, not day-to-day transactions."
why_incorrect:
  - option: "A"
    reason: "This describes an Operational Data Store, which is current-state-focused and frequently refreshed, not time-variant with deep history."
  - option: "C"
    reason: "This describes a Staging Area, a working area for raw data prior to transformation, not the warehouse itself."
  - option: "D"
    reason: "This describes a Data Mart, a subset scoped to one subject area or department, not the full enterprise warehouse."
