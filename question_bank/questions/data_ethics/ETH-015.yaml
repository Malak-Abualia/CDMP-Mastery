keywords: ["fairness", "aggregate accuracy", "subgroup evaluation"]
estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A model achieves strong overall accuracy, and the team declares it ethically sound on that basis alone, without evaluating performance across demographic subgroups. What is the flaw in this reasoning, per this Knowledge Area's fairness principle?"
answer_choices:
  - "A) There is no flaw; aggregate accuracy is sufficient evidence of ethical soundness"
  - "B) Data-driven decisions must be evaluated for whether they treat different groups fairly, not merely for statistical accuracy in aggregate — a high overall score can still mask unfair treatment of specific groups"
  - "C) The flaw is that the model wasn't tested for Recovery Point Objective (RPO) compliance"
  - "D) There is no flaw as long as the model was legally reviewed"
correct_answer: "B"
explanation: "The Fairness principle specifically requires evaluating whether different groups are treated fairly, not just whether aggregate accuracy looks acceptable — a documented, frequently tested gap between technical performance and ethical fairness."
why_incorrect:
  - option: "A"
    reason: "This treats aggregate accuracy as ethically sufficient on its own, a documented exam trap in this Knowledge Area."
  - option: "C"
    reason: "RPO is a Data Storage and Operations recovery concept, unrelated to model fairness evaluation."
  - option: "D"
    reason: "Legal review confirms compliance, a distinct and insufficient substitute for the ethical fairness evaluation this scenario is missing."
