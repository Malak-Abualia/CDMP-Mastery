learning_objective: "Identify the additional People and Process checks required before accepting a technology-driven maturity claim."
dama_concept: null
industry_practice_concept: "Technology-only maturity illusion (People/Process/Technology framing)"
keywords: ["technology-only illusion", "data catalog", "telecom"]
estimated_solving_time: 85
question_type: "Multiple Select"
stem: "A telecom company implements a state-of-the-art, AI-powered data catalog and declares its metadata management maturity 'high' on that basis alone. Select the **two** additional checks a rigorous maturity assessment would still require before accepting that claim."
answer_choices:
  - "A) Confirming Data Stewards have real allocated time and authority to maintain catalog content"
  - "B) Confirming the catalog vendor is a market leader by revenue"
  - "C) Confirming catalog workflows are actually used consistently rather than routinely bypassed under deadline pressure"
  - "D) Confirming the catalog's user interface uses modern web design conventions"
correct_answer: ["A", "C"]
explanation: "A sophisticated technology investment reflects only the Technology dimension. Genuine overall maturity also requires the People dimension (empowered, resourced roles maintaining the tool's content) and the Process dimension (whether the tool's workflows are actually followed, not bypassed) to be independently confirmed — the documented 'technology-only maturity illusion.'"
why_incorrect:
  - option: "B"
    reason: "Vendor market position is irrelevant to whether the organization's own People and Process dimensions are genuinely mature."
  - option: "D"
    reason: "Interface design aesthetics have no bearing on whether the underlying roles and processes supporting the tool are actually mature."
