subtopic: "Integrity"
difficulty: "Intermediate"
blooms_level: "Apply"
learning_objective: "Identify an orphaned foreign key as an Integrity violation, not a Consistency violation."
dama_concept: "Integrity"
industry_practice_concept: null
keywords: ["integrity", "orphaned foreign key", "referential integrity"]
estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "An Order record references a Customer ID that does not exist anywhere in the Customer table. Which dimension is violated?"
answer_choices:
  - "A) Consistency"
  - "B) Integrity"
  - "C) Validity"
  - "D) Uniqueness"
correct_answer: "B"
explanation: "Integrity concerns whether relationships between data elements (referential integrity) remain intact — an orphaned foreign key referencing a non-existent Customer record is a direct Integrity violation."
why_incorrect:
  - option: "A"
    reason: "Consistency concerns the same fact disagreeing across systems or time, not a broken relationship/reference."
  - option: "C"
    reason: "The Customer ID may be a perfectly well-formatted value — the problem is that it doesn't resolve to a real record, not its format."
  - option: "D"
    reason: "This scenario describes a broken reference, not an unintended duplicate entity."
