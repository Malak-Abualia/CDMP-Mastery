question_type: "Multiple Choice"
stem: "Which statement correctly distinguishes Storage Tiering from Archival?"
answer_choices:
  - "A) They are the same technique with different names"
  - "B) Storage Tiering moves data between faster/costlier and slower/cheaper storage based on access frequency; Archival moves data no longer needed for regular operational access into long-term, lower-cost storage while preserving retrievability"
  - "C) Archival always precedes Storage Tiering in the data lifecycle"
  - "D) Storage Tiering is only used for backup data, never for active data"
correct_answer: "B"
explanation: "Storage Tiering is an ongoing cost/performance optimization based on access frequency across active data; Archival specifically moves data out of regular operational use into long-term, lower-cost, still-retrievable storage — related but distinct lifecycle actions."
why_incorrect:
  - option: "A"
    reason: "They serve related but distinct purposes within the data lifecycle, not identical techniques."
  - option: "C"
    reason: "There is no fixed required ordering between the two; both are lifecycle techniques that may apply at different points depending on the data."
  - option: "D"
    reason: "Storage Tiering applies broadly to active data based on access frequency, not exclusively to backup data."
