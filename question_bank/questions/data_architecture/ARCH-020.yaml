question_type: "Multiple Select"
stem: "Which of the following statements accurately describe why cloud migration often becomes the event that forces an organization to finally document its Data Architecture? (Select all that apply.)"
answer_choices:
  - "A) Migration requires answering 'what do we actually have, and how does it all connect' before it can be safely moved"
  - "B) Cloud migration is fundamentally a Technology Architecture initiative with cascading Data Architecture consequences, such as data residency and latency constraints"
  - "C) Cloud platforms automatically generate a complete data architecture diagram with no manual documentation effort"
  - "D) Migrating without understanding existing data flows risks breaking downstream consumers who depend on undocumented dependencies"
correct_answer: ["A", "B", "D"]
explanation: "A, B, and D correctly describe why migration surfaces the need for architecture documentation: it forces an inventory of what exists, it has real cascading architectural consequences (residency, latency, security-zone constraints), and skipping this step risks breaking undocumented downstream dependencies."
why_incorrect:
  - option: "C"
    reason: "No cloud platform automatically generates a complete, accurate data architecture diagram — this remains a deliberate documentation and discovery effort undertaken by the organization."
