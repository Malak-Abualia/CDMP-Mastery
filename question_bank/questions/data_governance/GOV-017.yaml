estimated_solving_time: 75
question_type: "Scenario-Based"
stem: "Two previously independent companies have just merged. Each brings its own data governance practices, business units want to retain domain-specific control, but leadership also wants enterprise-wide policy consistency for shared reporting. Which governance operating model best fits this situation, and why?"
answer_choices:
  - "A) Centralized — because a single model is always superior after a merger"
  - "B) Decentralized — because each legacy company should keep full autonomy indefinitely"
  - "C) Hybrid — a central council sets enterprise-wide policy/standards while domain-level stewards implement and adapt within that frame"
  - "D) No formal governance model is needed until the merger integration is complete"
correct_answer: "C"
explanation: "The Hybrid model is the practical compromise DAMA discusses, and the pattern most real organizations converge on: central policy for consistency, domain-level implementation for responsiveness — directly fitting a scenario with both a stated need for consistency and a stated need for domain autonomy."
why_incorrect:
  - option: "A"
    reason: "DMBOK2 presents the operating models neutrally as tradeoffs, not with Centralized as universally superior — a well-documented exam trap."
  - option: "B"
    reason: "Full indefinite autonomy abandons leadership's explicit consistency goal."
  - option: "D"
    reason: "Deferring governance during a merger — precisely when data conflicts are most likely — is a documented anti-pattern, not a neutral choice."
