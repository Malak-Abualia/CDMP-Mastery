estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Which normal form eliminates transitive dependency, ensuring non-key attributes depend only on the primary key?"
answer_choices:
  - "A) First Normal Form (1NF)"
  - "B) Second Normal Form (2NF)"
  - "C) Third Normal Form (3NF)"
  - "D) None of these address transitive dependency"
correct_answer: "C"
explanation: "3NF eliminates transitive dependency — the requirement that non-key attributes depend only on the key, not on other non-key attributes."
why_incorrect:
  - option: "A"
    reason: "1NF addresses atomic values and the elimination of repeating groups, not transitive dependency."
  - option: "B"
    reason: "2NF addresses partial dependency on a composite key, a different (earlier) issue than transitive dependency."
  - option: "D"
    reason: "3NF specifically and directly addresses transitive dependency, so this option is factually incorrect."
