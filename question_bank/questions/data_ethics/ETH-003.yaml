question_type: "Multiple Choice"
stem: "What is Informed Consent, in the ethical (not merely technical) sense used in this Knowledge Area?"
answer_choices:
  - "A) Any technical checkbox click on an unread agreement"
  - "B) Agreement to data collection/use that is genuinely understood by the person giving it, not merely a technical formality"
  - "C) A default opt-in setting a user never actively selects"
  - "D) A legal disclaimer buried in dense terms-of-service language"
correct_answer: "B"
explanation: "Informed Consent requires genuine understanding of what is being agreed to, not merely technical compliance with a disclosure requirement."
why_incorrect:
  - option: "A"
    reason: "A technical checkbox click without genuine understanding fails the meaningful consent standard this Knowledge Area establishes."
  - option: "C"
    reason: "A default opt-in the user never actively chose does not constitute genuine, informed agreement."
  - option: "D"
    reason: "Dense, unread legal language may satisfy technical disclosure requirements without satisfying genuine comprehension."
