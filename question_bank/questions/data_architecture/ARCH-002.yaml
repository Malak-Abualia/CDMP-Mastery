question_type: "Multiple Choice"
stem: "What is a Data Domain, in Data Architecture terms?"
answer_choices:
  - "A) A physical server hosting a database"
  - "B) A logical grouping of data by subject area, used to organize architecture, scope ownership, and govern data"
  - "C) A specific SQL data type"
  - "D) A naming convention for database indexes"
correct_answer: "B"
explanation: "A Data Domain is a logical grouping of data by subject area (e.g., Customer, Product, Finance), used to organize architecture, assign ownership, and scope governance."
why_incorrect:
  - option: "A"
    reason: "A physical server is an infrastructure/Technology Architecture concern, not a logical grouping of data."
  - option: "C"
    reason: "A SQL data type is a physical-model detail, unrelated to subject-area grouping."
  - option: "D"
    reason: "An index naming convention is a Data Architecture Standard detail, not the definition of a Data Domain itself."
