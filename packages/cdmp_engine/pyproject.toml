[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmp-engine"
version = "0.1.0"
description = "CDMP Mastery Core Quiz Engine -- YAML loading, validation, selection, evaluation, scoring, and a CLI, over question_bank/questions/."
requires-python = ">=3.11"
dependencies = [
    "cdmp-content-schema>=0.1.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cdmp-quiz = "cdmp_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
