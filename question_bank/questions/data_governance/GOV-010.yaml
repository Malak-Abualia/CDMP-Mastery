question_type: "Multiple Choice"
stem: "An organization where one central team/council makes all governance decisions for the entire enterprise, prioritizing consistency over domain-specific responsiveness, is using which governance operating model?"
answer_choices:
  - "A) Federated"
  - "B) Decentralized"
  - "C) Centralized"
  - "D) Hybrid"
correct_answer: "C"
explanation: "Centralized governance concentrates decision-making in one team/council — consistent enterprise-wide, but can be slower and less attuned to domain nuance."
why_incorrect:
  - option: "A"
    reason: "Federated governance pushes decisions out to individual business units/domains, the opposite pattern from what is described."
  - option: "B"
    reason: "Decentralized describes the same domain-autonomy pattern as Federated, from the other side of the tradeoff."
  - option: "D"
    reason: "Hybrid blends central policy-setting with domain-level implementation, not the single-team model described here."
