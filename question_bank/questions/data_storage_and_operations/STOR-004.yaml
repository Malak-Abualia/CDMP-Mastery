question_type: "Multiple Choice"
stem: "What is the purpose of Data Masking?"
answer_choices:
  - "A) To improve query performance through indexing"
  - "B) To obscure or substitute sensitive values, typically for non-production environments, preventing unguarded exposure of sensitive data"
  - "C) To move infrequently accessed data to cheaper storage"
  - "D) To determine which source system wins when records conflict"
correct_answer: "B"
explanation: "Data Masking obscures or substitutes sensitive values, most commonly when provisioning non-production environments, so lower-security environments don't become an unguarded copy of production's most sensitive data."
why_incorrect:
  - option: "A"
    reason: "This describes Indexing, a performance management technique, unrelated to masking."
  - option: "C"
    reason: "This describes Storage Tiering, a lifecycle cost/performance technique, unrelated to masking."
  - option: "D"
    reason: "This describes a Survivorship Rule, a Master Data Management concept, unrelated to masking."
