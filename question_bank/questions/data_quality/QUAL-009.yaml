estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A daily sales report is fully accurate, complete, and correctly formatted, but historically must arrive by 6 a.m. and now consistently arrives at 11 a.m., after decisions have already been made without it. Which dimension is violated?"
answer_choices:
  - "A) Accuracy"
  - "B) Validity"
  - "C) Timeliness"
  - "D) Uniqueness"
correct_answer: "C"
explanation: "Even though the data itself is correct in every other dimension, arriving after its usable window has passed is a Timeliness failure — correctness and freshness are independent dimensions."
why_incorrect:
  - option: "A"
    reason: "The stem explicitly states the data is fully accurate — the problem is delay, not correctness."
  - option: "B"
    reason: "The stem explicitly states the data is correctly formatted — the problem is delay, not format."
  - option: "D"
    reason: "There is no indication of duplication in this scenario."
