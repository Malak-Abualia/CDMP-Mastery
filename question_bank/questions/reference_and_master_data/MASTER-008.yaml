keywords: ["registry style", "cross-reference keys", "virtual golden view"]
estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Which MDM implementation style stores only cross-reference keys, computing the 'golden view' on demand from data that stays physically in the source systems?"
answer_choices:
  - "A) Consolidation"
  - "B) Coexistence"
  - "C) Centralized"
  - "D) Registry"
correct_answer: "D"
explanation: "The Registry style is a thin, virtual layer — it doesn't store full master records, only the identifying cross-reference keys needed to compute a virtual golden view on demand from source systems."
why_incorrect:
  - option: "A"
    reason: "Consolidation physically extracts and merges master data into a separate, centralized store, unlike Registry's minimal footprint."
  - option: "B"
    reason: "Coexistence also physically maintains a centralized golden record, with bidirectional synchronization back to sources."
  - option: "C"
    reason: "Centralized makes the golden record the single system of record that applications directly read and write against."
