question_type: "Multiple Choice"
stem: "How do Master Data Management (MDM) and Metadata Management differ, despite their similar-sounding names?"
answer_choices:
  - "A) They do not differ — DAMA treats them as interchangeable terms"
  - "B) MDM manages authoritative instance/entity data (e.g., a golden Customer record); Metadata Management manages data about data (e.g., schemas, definitions, lineage)"
  - "C) Metadata Management is a subset of MDM"
  - "D) MDM only exists within Metadata Management's scope"
correct_answer: "B"
explanation: "Despite the similar names, MDM and Metadata Management are distinct disciplines — MDM manages authoritative entity/instance data, while Metadata Management manages data describing other data, such as schemas, glossary definitions, and lineage."
why_incorrect:
  - option: "A"
    reason: "They are never used interchangeably in DAMA framing, despite the superficially similar names."
  - option: "C"
    reason: "This incorrectly subordinates Metadata Management to MDM — they are peer, related-but-distinct Knowledge Areas."
  - option: "D"
    reason: "This incorrectly subordinates MDM to Metadata Management — they are peer, related-but-distinct Knowledge Areas."
