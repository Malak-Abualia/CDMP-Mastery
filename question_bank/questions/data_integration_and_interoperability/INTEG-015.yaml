learning_objective: "Identify the correct accountable party for approving a Data Sharing Agreement between systems or organizations."
dama_concept: "Data Sharing Agreement"
industry_practice_concept: null
keywords: ["data sharing agreement", "governance", "Data Owner accountability"]
estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Who should be accountable for approving a Data Sharing Agreement governing data leaving one domain and entering another system or organization?"
answer_choices:
  - "A) Whichever engineer built the integration pipeline"
  - "B) The accountable Data Owner(s) for the domain(s) involved"
  - "C) The receiving system's database administrator, unilaterally"
  - "D) No approval is needed as long as the data transfers successfully"
correct_answer: "B"
explanation: "A Data Sharing Agreement documents business-level terms (what is shared, under what conditions, at what quality/freshness level) that require accountable Data Owner sign-off, not a purely technical or unilateral decision."
why_incorrect:
  - option: "A"
    reason: "An engineer implements approved sharing terms but should not unilaterally decide or approve them, mirroring the Owner/Custodian boundary established throughout this project."
  - option: "C"
    reason: "A DBA operates the technical environment but is not the business-accountable party for approving data sharing terms."
  - option: "D"
    reason: "Successful technical transfer (integration) says nothing about whether the sharing arrangement itself was ever appropriately governed and approved."
