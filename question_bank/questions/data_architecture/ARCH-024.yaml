stem: "'Data Mesh' is a concept for domain-oriented, decentralized data architecture and ownership, commonly discussed in modern data platform contexts. What is its correct sourcing status relative to DMBOK2?"
answer_choices:
  - "A) Data Mesh is a term DAMA-DMBOK2 directly defines and mandates"
  - "B) Data Mesh is an industry-practice concept (associated with Zhamak Dehghani), not a DMBOK2-defined term, even though it echoes DAMA's federated governance ideas"
  - "C) Data Mesh is a specific database technology"
  - "D) Data Mesh replaces the need for Data Architecture as a Knowledge Area"
correct_answer: "B"
explanation: "Data Mesh is a real, industry-originated concept for domain-oriented, decentralized data architecture and ownership. DMBOK2 does not define or mandate this specific term, even though the underlying idea resonates with DAMA's federated/hybrid governance framing."
why_incorrect:
  - option: "A"
