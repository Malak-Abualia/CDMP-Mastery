question_type: "Multiple Choice"
stem: "A document describes the entities, attributes, and relationships of a single 'Customer' subject area. A separate document describes how Customer, Product, and Order data flow and integrate across the whole enterprise. Which discipline does each document belong to, respectively?"
answer_choices:
  - "A) Both documents are Data Architecture artifacts"
  - "B) Both documents are Data Modeling artifacts"
  - "C) The first is Data Modeling; the second is Data Architecture"
  - "D) The first is Data Architecture; the second is Data Modeling"
correct_answer: "C"
explanation: "A model describes the structure of one specific subject area; architecture describes the enterprise-wide blueprint of how multiple subject areas, systems, and flows fit together — the single most commonly confused adjacent-KA pair in this Knowledge Area."
why_incorrect:
  - option: "A"
    reason: "The first document, scoped to one subject area's structure, is a Data Modeling artifact, not Data Architecture."
  - option: "B"
    reason: "The second document, describing enterprise-wide flow and integration, is a Data Architecture artifact, not Data Modeling."
  - option: "D"
    reason: "This reverses the correct scope assignment for both documents."
