question_type: "Scenario-Based"
stem: "A team needs shared, file-level storage that multiple application servers can access over the network for document storage, without the demanding low-latency requirements of a transactional database. Which storage architecture best fits this need?"
answer_choices:
  - "A) Direct Attached Storage (DAS)"
  - "B) Network Attached Storage (NAS)"
  - "C) Storage Area Network (SAN)"
  - "D) Data Virtualization"
correct_answer: "B"
explanation: "NAS provides file-level storage accessible over a network to multiple systems, a good fit for shared document storage without the low-latency, block-level demands a SAN is built for."
why_incorrect:
  - option: "A"
    reason: "DAS is attached to a single server and is not natively shareable across multiple systems, failing the stated shared-access requirement."
  - option: "C"
    reason: "A SAN provides high-performance block-level access typically reserved for demanding database workloads, more capability than this file-sharing scenario requires."
  - option: "D"
    reason: "Data Virtualization is an access-layer technique for querying data across systems, not a physical storage architecture choice."
