question_type: "Multiple Select"
stem: "Which of the following statements about star and snowflake schemas are accurate? (Select all that apply.)"
answer_choices:
  - "A) A star schema connects a fact table directly to denormalized dimension tables"
  - "B) A snowflake schema further normalizes dimensions into sub-dimensions"
  - "C) A snowflake schema always performs better than a star schema for every query"
  - "D) Both patterns are industry-standard techniques DMBOK2 references rather than invents"
correct_answer: ["A", "B", "D"]
explanation: "A and B correctly define the two patterns; D correctly reflects that dimensional-modeling vocabulary originates from Ralph Kimball's methodology and is referenced, not invented, by DMBOK2."
why_incorrect:
  - option: "C"
    reason: "Neither pattern universally outperforms the other — star schemas typically favor query simplicity and performance, while snowflake schemas favor reduced redundancy; DMBOK2 presents this as a tradeoff, not an absolute ranking."
