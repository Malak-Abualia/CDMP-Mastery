question_type: "Scenario-Based"
stem: "Sales and Finance departments each calculate 'churned customer' differently, producing contradictory dashboards that executives no longer trust. Which governance mechanism most directly addresses this problem?"
answer_choices:
  - "A) Hiring more data engineers to rebuild both dashboards"
  - "B) A governed Business Glossary with an approved, single definition of the term"
  - "C) Migrating both departments to the same BI tool"
  - "D) Increasing the data warehouse's refresh frequency"
correct_answer: "B"
explanation: "A governed Business Glossary is the artifact that resolves conflicting definitions by giving departments a single, Steward-maintained, Owner-approved meaning to build against — directly addressing the conflicting-definitions problem Governance exists to solve."
why_incorrect:
  - option: "A"
    reason: "More engineering effort without resolving the underlying definitional conflict just rebuilds the same disagreement in new code."
  - option: "C"
    reason: "A shared tool doesn't create a shared definition — the departments would still disagree on what 'churned' means."
  - option: "D"
    reason: "Refresh frequency is a timeliness/technical concern unrelated to a definitional conflict."
