estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A marketing team needs a system specifically to manage thousands of product images and video files, including tracking their usage rights and current version. Which content system category is the best fit?"
answer_choices:
  - "A) Document Management System (DMS)"
  - "B) Web Content Management (WCM)"
  - "C) Digital Asset Management (DAM)"
  - "D) Enterprise Service Bus (ESB)"
correct_answer: "C"
explanation: "Digital Asset Management (DAM) is specifically focused on media assets (images, video, audio) and their associated rights/usage metadata, exactly matching this need."
why_incorrect:
  - option: "A"
    reason: "A DMS is focused on document-centric content (versioning, check-in/check-out for documents), not specifically media asset rights management."
  - option: "B"
    reason: "WCM is focused on managing website content publication, not a general media asset library with rights tracking."
  - option: "D"
    reason: "An ESB is a Data Integration and Interoperability architecture style for routing data between systems, unrelated to media asset management."
