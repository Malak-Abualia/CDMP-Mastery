estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A model includes full attributes, primary and foreign keys, and is normalized to 3NF — but specifies no data types, indexes, or partitioning. What level of abstraction is this model?"
answer_choices:
  - "A) Conceptual Data Model"
  - "B) Logical Data Model"
  - "C) Physical Data Model"
  - "D) Canonical Data Model"
correct_answer: "B"
explanation: "The presence of data types, indexes, or partitioning is what signals a Physical model. A model with full attributes and keys but no storage/technology detail is still Logical — a frequently tested exam distinction."
why_incorrect:
  - option: "A"
    reason: "A Conceptual model contains only entities and relationships, not full attributes and keys as described here."
  - option: "C"
    reason: "A Physical model requires technology-specific detail such as data types and indexes, which this model explicitly lacks."
  - option: "D"
    reason: "A Canonical Data Model is an integration reference concept, not one of the three abstraction levels."
