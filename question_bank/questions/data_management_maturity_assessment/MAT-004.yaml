question_type: "Multiple Choice"
stem: "Which of the following best characterizes the 'Initial / Ad Hoc' (Level 1) maturity level?"
answer_choices:
  - "A) Practices are inconsistent, undocumented, and dependent on individual effort rather than institutionalized process"
  - "B) Practices are actively measured with defined metrics used to monitor and control performance"
  - "C) The organization continuously improves practices based on quantitative feedback"
  - "D) Practices are documented, standardized, and institutionalized organization-wide"
correct_answer: "A"
explanation: "Level 1 (Initial/Ad Hoc) is characterized by inconsistent, undocumented practices dependent on individual effort, reactive rather than proactive."
why_incorrect:
  - option: "B"
    reason: "This describes Level 4 (Quantitatively Managed), a much higher maturity level."
  - option: "C"
    reason: "This describes Level 5 (Optimized), the highest maturity level."
  - option: "D"
    reason: "This describes Level 3 (Defined), a mid-range maturity level, not the lowest."
