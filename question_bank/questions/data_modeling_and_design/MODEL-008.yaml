estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A data engineer is designing a Customer dimension for a warehouse. Customer email addresses (the natural key) can change over time and are occasionally reused for a different person after account closure. What is the most defensible key strategy?"
answer_choices:
  - "A) Use the email address as the primary key, since it is business-meaningful"
  - "B) Use a system-generated surrogate key, since the natural key is unstable and can be reused"
  - "C) Use no primary key at all in the dimension table"
  - "D) Use the customer's phone number instead, since it never changes"
correct_answer: "B"
explanation: "Surrogate keys are preferred in warehouse dimensions specifically because natural keys can change or be reused, which would destabilize historical tracking if used as the primary key directly."
why_incorrect:
  - option: "A"
    reason: "Using an unstable, reusable natural key as the primary key risks silently merging two different people's history once the email is reassigned."
  - option: "C"
    reason: "Omitting a primary key entirely breaks referential integrity for every fact table joining to this dimension."
  - option: "D"
    reason: "Phone numbers are also business-meaningful and can change or be reassigned, carrying the same instability risk as email."
