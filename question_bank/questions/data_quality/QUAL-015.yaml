question_type: "Multiple Select"
stem: "Which of the following role-responsibility pairings for Data Quality Management are correct? (Select all that apply.)"
answer_choices:
  - "A) Data Owner — accountable for the overall quality outcome of their domain"
  - "B) Data Steward — translates the Owner's intent into concrete quality rules and thresholds"
  - "C) Data Custodian — implements validation checks and monitoring dashboards"
  - "D) Data Engineer — unilaterally decides business-level quality thresholds without Steward input"
correct_answer: ["A", "B", "C"]
explanation: "A, B, and C correctly reflect DAMA's role framing for Data Quality — Owner accountability, Steward rule translation, and Custodian technical implementation."
why_incorrect:
  - option: "D"
    reason: "A Data Engineer should not unilaterally decide business-level quality thresholds — this is explicitly the wrong pairing, since threshold decisions belong to the Owner, with the Engineer implementing Steward-defined rules."
