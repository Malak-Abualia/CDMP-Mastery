estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A single employee role can both edit a supplier's banking details and independently approve outgoing payments to that supplier, with no second reviewer required. What principle should have prevented this configuration?"
answer_choices:
  - "A) Least Privilege"
  - "B) Segregation of Duties"
  - "C) Data Loss Prevention"
  - "D) Data Masking"
correct_answer: "B"
explanation: "Segregation of Duties specifically requires that no single individual hold enough combined permissions to both perform a sensitive action (editing banking details) and approve/conceal it (approving payment) alone — exactly the gap described."
why_incorrect:
  - option: "A"
    reason: "Least Privilege concerns whether a role has more access than its function requires overall, not specifically the fraud risk of combining conflicting sensitive permissions in one role."
  - option: "C"
    reason: "DLP concerns detecting/blocking unauthorized data movement, unrelated to combined-permission fraud risk."
  - option: "D"
    reason: "Data Masking is a data protection technique for non-production use, unrelated to permission design."
