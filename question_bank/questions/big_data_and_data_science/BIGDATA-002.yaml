stem: "What is Data Science?"
answer_choices:
  - "A) Datasets exceeding traditional tools' volume, velocity, or variety capacity"
  - "B) The multidisciplinary practice of extracting insight and building predictive/analytical capability from data, combining statistics, computer science, and domain expertise"
  - "C) A storage repository holding raw data without a predefined schema"
  - "D) A directive suspending normal data retention for litigation"
correct_answer: "B"
explanation: "Data Science is the multidisciplinary practice of extracting insight and building predictive/analytical capability from data, applicable to data of any size."
why_incorrect:
  - option: "A"
    reason: "This describes Big Data, a distinct concept concerning data characteristics, not the analytical discipline itself."
