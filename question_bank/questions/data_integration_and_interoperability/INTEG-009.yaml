estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A team needs analysts to query a combined view of data across three source systems without physically copying any of the data into a new store. Which integration pattern best fits this need?"
answer_choices:
  - "A) Data Replication"
  - "B) Data Federation / Virtualization"
  - "C) Batch integration"
  - "D) Data Migration"
correct_answer: "B"
explanation: "Data Federation/Virtualization is defined by providing a unified, on-demand queryable view across systems without physically moving or consolidating the data, exactly matching this need."
why_incorrect:
  - option: "A"
    reason: "Data Replication physically copies data to another location, which the scenario explicitly wants to avoid."
  - option: "C"
    reason: "Batch integration physically moves data on a schedule, which the scenario explicitly wants to avoid."
  - option: "D"
    reason: "Data Migration is a one-time, large-scale movement to a new environment, not an ongoing federated query need."
