keywords: ["ethics review", "compliance sufficiency fallacy"]
estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A company's legal team confirms a new data-sharing partnership fully complies with all applicable regulations. Based on this confirmation alone, the project proceeds without further review. What does this scenario best illustrate?"
answer_choices:
  - "A) Correct practice — legal confirmation is sufficient evidence a data practice is acceptable"
  - "B) A documented Common Mistake — treating legal compliance as equivalent to ethical practice, when compliance is only a floor, not a ceiling"
  - "C) An Authentication failure"
  - "D) A Data Loss Prevention gap"
correct_answer: "B"
explanation: "Proceeding based solely on legal compliance confirmation, without separately evaluating the practice's ethical impact, fairness, and transparency, is precisely the documented Common Mistake of conflating compliance with ethics."
why_incorrect:
  - option: "A"
    reason: "This treats legal compliance as sufficient on its own, the central documented misconception this Knowledge Area exists to correct."
  - option: "C"
    reason: "Authentication concerns identity verification, unrelated to this governance-process gap."
  - option: "D"
    reason: "DLP concerns unauthorized data movement, unrelated to the described ethics-review gap."
