question_type: "Multiple Choice"
stem: "Fact tables, dimension tables, and the concept of 'grain' are core dimensional modeling vocabulary discussed in DMBOK2. What is the correct sourcing of this terminology?"
answer_choices:
  - "A) DAMA-DMBOK2 originated this dimensional modeling terminology"
  - "B) This terminology originates with Ralph Kimball's warehouse methodology; DMBOK2 references and endorses it without claiming to have invented it"
  - "C) This terminology has no relationship to DMBOK2 content whatsoever"
  - "D) This is a legally mandated financial reporting standard"
correct_answer: "B"
explanation: "Dimensional modeling terminology (fact, dimension, grain, star/snowflake) originates with Ralph Kimball's warehouse methodology. DMBOK2 references and endorses these concepts within its Data Modeling and Data Warehousing chapters, but the methodology itself is industry practice, not a DAMA invention."
why_incorrect:
  - option: "A"
    reason: "Crediting DAMA as the originator of this externally-sourced practitioner terminology is exactly the exam trap this Knowledge Area documents."
  - option: "C"
    reason: "DMBOK2 directly discusses and applies this vocabulary within its Data Modeling and Data Warehousing chapters — it is not unrelated to DMBOK2 content."
  - option: "D"
    reason: "Fact/dimension/grain are modeling vocabulary, unrelated to any regulatory financial-reporting mandate."
