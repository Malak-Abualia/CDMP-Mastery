question_type: "Multiple Choice"
stem: "What are Survivorship Rules?"
answer_choices:
  - "A) Rules controlling which source system may write to a database"
  - "B) Governed business rules determining which attribute value 'wins' when matched source records disagree"
  - "C) Rules defining a database's backup and recovery schedule"
  - "D) Rules restricting which employees can view PII fields"
correct_answer: "B"
explanation: "Survivorship Rules are the governed business rules that determine, when matched source records disagree on an attribute's value, which value survives into the Golden Record."
why_incorrect:
  - option: "A"
    reason: "Write access control is a technical/security concern, not a rule for resolving conflicting attribute values."
  - option: "C"
    reason: "Backup and recovery scheduling is a Data Storage and Operations concern, unrelated to attribute conflict resolution."
  - option: "D"
    reason: "PII access restriction is a Data Security concern, not a Survivorship Rule."
