question_type: "Multiple Choice"
stem: "What is Orchestration, in the context of Data Integration and Interoperability?"
answer_choices:
  - "A) The coordinated sequencing and management of multiple integration processes, including dependencies, timing, and failure handling"
  - "B) The formal specification of a data producer's schema and semantics"
  - "C) The irreversible removal of identifying information from a dataset"
  - "D) The physical copying of data to another storage location"
correct_answer: "A"
explanation: "Orchestration is the coordinated sequencing and management of multiple integration processes/jobs, including their dependencies, timing, and failure handling."
why_incorrect:
  - option: "B"
    reason: "This describes a Data Contract, a distinct concept concerned with interface specification, not job sequencing."
  - option: "C"
    reason: "This describes Anonymization, a Data Security concept, unrelated to job coordination."
  - option: "D"
    reason: "This describes Data Replication, a distinct data movement pattern, not job orchestration."
