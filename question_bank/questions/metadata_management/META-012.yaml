question_type: "Multiple Choice"
stem: "What is a 'data swamp'?"
answer_choices:
  - "A) A DAMA-official term for a well-governed data lake"
  - "B) An industry term for an ungoverned, undiscoverable data lake lacking metadata discipline"
  - "C) A type of metadata repository"
  - "D) A synonym for a data catalog"
correct_answer: "B"
explanation: "A 'data swamp' is an industry-practice term for a lake with no catalog or metadata discipline — technically holding data, but practically undiscoverable and untrustworthy — not a DAMA-official concept."
why_incorrect:
  - option: "A"
    reason: "The term specifically describes a poorly-governed, not well-governed, lake, and it is industry vocabulary, not DAMA-official terminology."
  - option: "C"
    reason: "A data swamp describes a state of poor metadata discipline, not a type of repository technology."
  - option: "D"
    reason: "A data swamp is effectively the absence of effective cataloging, the opposite of what a data catalog provides."
