estimated_solving_time: 70
question_type: "Scenario-Based"
stem: "A Data Engineer decides unilaterally to purge warehouse fact table history older than 90 days to reduce storage costs, without consulting the Data Owner or checking any retention policy. Three months later, Finance cannot produce a required multi-year trend report. What governance principle was violated?"
answer_choices:
  - "A) Retention and archival is a governed policy decision requiring Owner-level accountability, not a unilateral engineering choice"
  - "B) Data Warehouses are not required to retain any history beyond current state, so no principle was violated"
  - "C) An OLAP cube should have been used instead to avoid this problem"
  - "D) The Data Engineer correctly optimized for cost, and Finance's requirement was unreasonable"
correct_answer: "A"
explanation: "Retention and archival policy is a governed decision — how long history must remain queryable, and under what regulatory or business need — that a Data Engineer implements but does not unilaterally set, mirroring the Owner/Custodian accountability boundary established elsewhere in this Knowledge Area's role definitions."
why_incorrect:
  - option: "B"
    reason: "This directly contradicts the Data Warehouse's defining time-variant, non-volatile characteristics (Section 1), which specifically imply retained history is expected, not optional by default."
  - option: "C"
    reason: "An OLAP cube is an analytical query structure; it does not address the governance question of who decides retention policy."
  - option: "D"
    reason: "This dismisses a real, documented governance violation — cost optimization does not override the Data Owner's accountability for retention decisions."
