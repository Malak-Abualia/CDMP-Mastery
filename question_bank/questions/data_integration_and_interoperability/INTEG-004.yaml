estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "What is the purpose of a Data Contract in an integration context?"
answer_choices:
  - "A) To formally specify a data producer's schema, semantics, and quality commitments to its consumers"
  - "B) To physically move data from a source system to a target system"
  - "C) To determine which encryption algorithm protects data in transit"
  - "D) To grant a user the minimum access needed for their function"
correct_answer: "A"
explanation: "A Data Contract formally specifies a data producer's schema, semantics, and quality expectations for its consumers, directly supporting interoperability across a system boundary."
why_incorrect:
  - option: "B"
    reason: "This describes a data movement/integration pattern (e.g., batch or replication), not the contract that governs it."
  - option: "C"
    reason: "Encryption algorithm choice is a Data Security concern, unrelated to a contract's schema/semantics purpose."
  - option: "D"
    reason: "This describes Least Privilege, a Data Security access-scoping principle, unrelated to Data Contracts."
