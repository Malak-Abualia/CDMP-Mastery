estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "An application needs to store and retrieve semi-structured, JSON-like records that vary in shape from one record to the next, with no need for complex multi-table joins. Which database category is the best workload fit?"
answer_choices:
  - "A) Relational (RDBMS)"
  - "B) Document database"
  - "C) Graph database"
  - "D) Whichever type the team already knows best"
correct_answer: "B"
explanation: "Document databases are specifically optimized for storing and retrieving semi-structured, JSON-like records with varying shape, matching the described need."
why_incorrect:
  - option: "A"
    reason: "A relational database enforces a fixed schema and is optimized for structured, table-based data with joins, a weaker fit for varying-shape semi-structured records."
  - option: "C"
    reason: "Graph databases are optimized for traversing densely connected relationships, not for general semi-structured record storage."
  - option: "D"
    reason: "Defaulting to familiarity rather than evaluating actual workload fit is a documented anti-pattern in this Knowledge Area."
