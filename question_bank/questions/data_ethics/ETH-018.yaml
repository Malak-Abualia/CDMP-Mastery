estimated_solving_time: 75
question_type: "Scenario-Based"
stem: "An automated fraud-detection system flags a customer's account based on an outdated address field that was never updated after the customer moved, incorrectly associating them with a fraud pattern from their old neighborhood. The customer's account is frozen for two weeks while the error is investigated. How should this incident be analyzed using this Knowledge Area's framing?"
answer_choices:
  - "A) This is purely a Data Quality defect with no ethical dimension"
  - "B) This is a Data Quality defect (an inaccurate, stale field) that compounds into a direct ethical harm, since the error was used to make a consequential decision materially affecting the customer"
  - "C) This is purely an ethical issue with no data quality component"
  - "D) This incident has no connection to any other Knowledge Area in this project"
correct_answer: "B"
explanation: "An inaccurate or incomplete record isn't just a quality defect when it's used to make a consequential decision about a person — it becomes a direct harm, exactly the compounding relationship this Knowledge Area establishes between Data Quality and Data Ethics."
why_incorrect:
  - option: "A"
    reason: "This ignores the real, direct harm (a frozen account, real inconvenience and potential financial impact) the stale data caused when used in a consequential automated decision."
  - option: "C"
    reason: "This ignores the clear underlying Data Quality root cause (an outdated, unmaintained address field) that triggered the harmful decision."
  - option: "D"
    reason: "This incident is explicitly connected to Data Quality (`data_quality.md`) via this Knowledge Area's own documented cross-reference regarding data used in consequential decisions."
