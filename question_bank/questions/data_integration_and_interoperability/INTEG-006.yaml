learning_objective: "Apply the Integration vs. Interoperability distinction to a described cross-organizational exchange failure."
dama_concept: "Data Integration; Interoperability"
industry_practice_concept: null
keywords: ["integration success", "interoperability failure", "semantic mismatch"]
estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "Two partner organizations successfully exchange a data file every night with zero transmission errors for six months. During an audit, they discover that one organization's 'Order Date' field represents the date an order was placed, while the receiving organization has been treating it as the date the order shipped, silently skewing every downstream report. What does this scenario best illustrate?"
answer_choices:
  - "A) A complete failure of Data Integration, since the exchange should be halted"
  - "B) A successful Data Integration process that has nonetheless failed at Interoperability, due to a semantic mismatch never resolved by a Data Contract"
  - "C) A Data Loss Prevention failure"
  - "D) Evidence that batch integration is inherently less reliable than real-time integration"
correct_answer: "B"
explanation: "The file transfer itself succeeded consistently (integration), but the two organizations never agreed on what the 'Order Date' field actually meant (interoperability failure) — exactly the kind of semantic mismatch a Data Contract is meant to prevent."
why_incorrect:
  - option: "A"
    reason: "The transmission itself was successful and reliable for six months; the failure is semantic, not a movement/transport failure."
  - option: "C"
    reason: "DLP concerns unauthorized data exfiltration, unrelated to a semantic field-meaning mismatch between trusted partners."
  - option: "D"
    reason: "The scenario's failure has nothing to do with batch vs. real-time timing; it is a meaning-agreement failure that could occur under either pattern."
