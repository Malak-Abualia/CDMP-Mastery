question_type: "Multiple Select"
stem: "Which of the following are part of DAMA's core, mandatory governance artifact hierarchy? (Select all that apply.)"
answer_choices:
  - "A) Policy"
  - "B) Standard"
  - "C) Procedure"
  - "D) Guideline"
  - "E) Framework"
correct_answer: ["A", "B", "C"]
explanation: "Policy, Standard, and Procedure form the mandatory hierarchy. A Guideline is a recommended-but-not-mandatory fourth tier some frameworks add; 'Framework' is not a DAMA artifact tier at all."
why_incorrect:
  - option: "D"
    reason: "A Guideline is explicitly non-mandatory, distinguishing it from the three core, mandatory tiers — a frequently tested trap."
  - option: "E"
    reason: "Framework is not a defined governance artifact in this hierarchy."
