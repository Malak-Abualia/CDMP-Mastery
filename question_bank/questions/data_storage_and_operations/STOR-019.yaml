estimated_solving_time: 70
question_type: "Scenario-Based"
stem: "A company adopts Data Virtualization to give analysts a unified view across five source systems without physically consolidating the data. Query performance is now inconsistent, occasionally very slow, and analysts complain the 'single view' sometimes shows different results depending on which source system is temporarily unavailable. What does this scenario best illustrate?"
answer_choices:
  - "A) Data Virtualization is a flawed technique that should never be used"
  - "B) Data Virtualization improves access, not the quality or consistency of underlying source data, and query-time performance depends on the live availability of every underlying source"
  - "C) The company should have used Storage Tiering instead"
  - "D) This outcome indicates a Recovery Time Objective (RTO) failure"
correct_answer: "B"
explanation: "Data Virtualization computes a unified view on demand from data that remains physically in its source systems — it improves access convenience, not the underlying data's quality or consistency, and its performance and completeness are inherently dependent on every source system being live and responsive at query time, exactly the tradeoff this scenario demonstrates."
why_incorrect:
  - option: "A"
    reason: "This overgeneralizes a known, documented tradeoff into a blanket rejection of a legitimate technique with real appropriate use cases."
  - option: "C"
    reason: "Storage Tiering addresses cost/performance for already-consolidated data, not the cross-system access problem Data Virtualization is meant to solve."
  - option: "D"
    reason: "RTO concerns recovery from failure, unrelated to the ongoing query-time performance and consistency tradeoffs of a virtualization layer."
