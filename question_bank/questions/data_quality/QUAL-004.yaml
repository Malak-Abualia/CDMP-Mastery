question_type: "Multiple Choice"
stem: "What does Data Profiling primarily produce?"
answer_choices:
  - "A) A fixed, corrected dataset"
  - "B) A diagnostic understanding of data's current structure, content, and statistical characteristics"
  - "C) A governance policy document"
  - "D) A business glossary"
correct_answer: "B"
explanation: "Data Profiling analyzes data's structure, content, and statistical characteristics (distributions, null rates, patterns, outliers) to understand its current state — it is diagnostic and reveals issues, it does not itself fix anything."
why_incorrect:
  - option: "A"
    reason: "Producing a fixed dataset describes Data Cleansing, a separate, remediation-focused activity."
  - option: "C"
    reason: "A governance policy document is a Data Governance artifact, not a Data Quality activity output."
  - option: "D"
    reason: "A business glossary is a Metadata Management artifact, unrelated to profiling's diagnostic purpose."
