question_type: "Scenario-Based"
stem: "An insurance company's 'Claim' concept is implemented differently across its intake system, adjudication system, and regulatory reporting system, each built independently over many years. Leadership wants consistency for regulatory reporting without forcing a costly rebuild of all three systems. What is the most defensible Data Modeling approach?"
answer_choices:
  - "A) Force all three systems onto one identical physical schema immediately"
  - "B) Agree on a shared Conceptual Model for 'Claim' across all three systems, allowing each system's Physical Model to differ while remaining reconcilable at the Logical level"
  - "C) Skip conceptual and logical modeling and reconcile only at the reporting layer with SQL joins"
  - "D) Treat this purely as a Data Integration problem with no modeling component"
correct_answer: "B"
explanation: "A shared Conceptual Model lets each system's physical implementation differ while staying reconcilable at the logical level — exactly the approach that lets divergent systems achieve consistent regulatory reporting without a disruptive full physical rebuild, matching DMBOK2's framing of the three levels as serving different purposes and audiences."
why_incorrect:
  - option: "A"
    reason: "Forcing physical uniformity is the costly, disruptive option leadership explicitly wants to avoid, and is not necessary to achieve reporting consistency."
  - option: "C"
    reason: "Skipping conceptual and logical modeling and patching only at the reporting layer is the exact 'collapsing levels' anti-pattern this Knowledge Area exists to prevent — it treats a symptom, not the structural cause."
  - option: "D"
    reason: "While integration is involved in reconciling systems, the described problem is fundamentally about reconciling differing structural representations of the same real-world concept — a modeling problem, not only an integration one."
