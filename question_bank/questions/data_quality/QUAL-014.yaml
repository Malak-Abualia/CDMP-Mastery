estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Who is typically accountable for deciding what quality threshold is 'good enough' for a data domain?"
answer_choices:
  - "A) Data Custodian"
  - "B) Data Engineer"
  - "C) Data Owner"
  - "D) Data quality tooling vendor"
correct_answer: "C"
explanation: "The Data Owner is accountable for the overall quality outcome of their data domain and approves what quality means and what thresholds are acceptable — a business decision, not a technical one."
why_incorrect:
  - option: "A"
    reason: "The Custodian implements the technical controls Owners/Stewards decide are necessary, but does not set the threshold itself."
  - option: "B"
    reason: "A Data Engineer most often functions as the Custodian for quality — implementing rules, not deciding business-level thresholds."
  - option: "D"
    reason: "A tooling vendor provides mechanism, not the accountable business decision about what counts as acceptable quality."
