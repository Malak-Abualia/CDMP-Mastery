question_type: "Multiple Select"
stem: "Select the three items below that are principles of the Belmont Report. (Select three.)"
answer_choices:
  - "A) Respect for Persons"
  - "B) Beneficence"
  - "C) Availability"
  - "D) Justice"
  - "E) Interoperability"
correct_answer: ["A", "B", "D"]
explanation: "Respect for Persons (autonomy and informed consent), Beneficence (maximizing benefit and minimizing harm), and Justice (fair distribution of benefits and burdens) are the three named Belmont Report principles."
why_incorrect:
  - option: "C"
    reason: "Availability is part of the CIA Triad, a Data Security framing, not a Belmont Report principle."
  - option: "E"
    reason: "Interoperability is a Data Integration and Interoperability concept, unrelated to the Belmont Report."
