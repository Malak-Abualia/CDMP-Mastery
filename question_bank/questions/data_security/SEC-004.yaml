stem: "What are the three components of the CIA Triad, the foundational framing of what data security protects?"
answer_choices:
  - "A) Confidentiality, Integrity, Availability"
  - "B) Classification, Identity, Authorization"
  - "C) Consistency, Integration, Accuracy"
  - "D) Confidentiality, Indexing, Auditing"
correct_answer: "A"
explanation: "The CIA Triad — Confidentiality, Integrity, and Availability — is the standard industry framing for what data security protects: authorized-only access, protection from improper alteration, and accessibility when needed."
why_incorrect:
  - option: "B"
    reason: "This is not the CIA Triad; it mixes unrelated Data Security terms into an incorrect acronym expansion."
  - option: "C"
    reason: "Consistency and Accuracy are Data Quality dimensions, not components of the CIA Triad."
  - option: "D"
    reason: "Indexing and Auditing are related practices but not the correct expansion of the CIA Triad's second and third letters."
