question_type: "Multiple Choice"
stem: "What does the Completeness data quality dimension measure?"
answer_choices:
  - "A) The degree to which all data required for a given purpose is present"
  - "B) The degree to which data agrees across systems"
  - "C) The degree to which no entity is duplicated"
  - "D) The degree to which relationships between records remain intact"
correct_answer: "A"
explanation: "Completeness is the degree to which all data required for a given purpose is present — no missing values where a value is required, such as a mandatory phone number field needed for SMS notifications."
why_incorrect:
  - option: "B"
    reason: "Agreement across systems describes Consistency, not Completeness."
  - option: "C"
    reason: "Absence of unintended duplication describes Uniqueness, not Completeness."
  - option: "D"
    reason: "Intact relationships between records describes Integrity, not Completeness."
