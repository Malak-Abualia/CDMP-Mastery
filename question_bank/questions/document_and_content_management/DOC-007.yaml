question_type: "Multiple Choice"
stem: "How does Records Management differ from general Content Management?"
answer_choices:
  - "A) They are identical disciplines with different names"
  - "B) Records Management is a more formally governed subset focused specifically on content classified as legally/regulatorily significant Records; general Content Management addresses the broader category of all content"
  - "C) Records Management only applies to paper documents, never digital content"
  - "D) Content Management is a subset of Records Management"
correct_answer: "B"
explanation: "Records Management is specifically the more formal, governed discipline for the subset of content classified as Records (evidence of transactions the organization must retain), while general Content Management addresses the broader universe of all content, not only records."
why_incorrect:
  - option: "A"
    reason: "They are related but distinct — records management is a formally governed subset, not a synonym for the broader discipline."
  - option: "C"
    reason: "Records Management applies equally to digital and paper records; nothing restricts it to paper only."
  - option: "D"
    reason: "This reverses the actual relationship — Records Management is the narrower, more formally governed subset of the broader Content Management discipline."
