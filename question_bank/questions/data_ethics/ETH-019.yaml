question_type: "Scenario-Based"
stem: "A company deploys a high-risk automated hiring system only in jurisdictions where no AI-specific regulation like the EU AI Act currently applies. Internal testing reveals a known, unaddressed subgroup fairness disparity. Leadership argues no action is required since no applicable law currently mandates fairness evaluation. What is the most accurate assessment of this argument?"
answer_choices:
  - "A) The argument is correct; without a specific legal mandate, there is no obligation to address the disparity"
  - "B) The argument is flawed — the absence of jurisdiction-specific regulation does not resolve the ethical question, since legal compliance is a floor, not a ceiling, and the underlying fairness principle applies independent of current legal status"
  - "C) The argument is correct only because the EU AI Act specifically requires this analysis"
  - "D) The argument is irrelevant because hiring systems are outside this Knowledge Area's scope"
correct_answer: "B"
explanation: "This is a direct application of the central ethics-vs-compliance principle — deliberately operating only where no specific regulation yet applies does not make an unaddressed, known fairness disparity ethically acceptable; the ethical obligation to evaluate and address it exists independent of jurisdiction-specific legal status."
why_incorrect:
  - option: "A"
    reason: "This treats the absence of a specific legal mandate as ethically dispositive, the central documented misconception this Knowledge Area exists to correct."
  - option: "C"
    reason: "This gets the reasoning backwards — the ethical obligation doesn't depend on which specific regulation happens to apply in a given jurisdiction; it exists independent of local legal status."
  - option: "D"
    reason: "Hiring systems are a well-documented, high-stakes example of exactly the kind of consequential, fairness-sensitive data-driven decision this Knowledge Area directly addresses."
