question_type: "Scenario-Based"
stem: "A ride-sharing company needs a driver's location to update in the rider's app within a second or two of the driver actually moving. Which integration pattern is the appropriate fit?"
answer_choices:
  - "A) Batch integration, run nightly"
  - "B) Real-time / near-real-time (event-driven) integration"
  - "C) Data Migration"
  - "D) EDI"
correct_answer: "B"
explanation: "A sub-few-second freshness requirement for continuously changing location data is a textbook case for real-time/near-real-time, event-driven integration."
why_incorrect:
  - option: "A"
    reason: "Nightly batch would make location data hours or a full day stale, entirely failing the described real-time need."
  - option: "C"
    reason: "Data Migration is a one-time, large-scale movement, not an ongoing operational pattern for continuously updating location data."
  - option: "D"
    reason: "EDI is a cross-organizational business document exchange standard, unrelated to real-time internal location updates."
