question_type: "Multiple Choice"
stem: "A model defines a general 'Party' entity with specialized 'Person' and 'Organization' subtypes that share common attributes but also have distinct ones. What modeling technique does this represent?"
answer_choices:
  - "A) Denormalization"
  - "B) Generalization / Subtyping"
  - "C) Surrogate key assignment"
  - "D) Canonical Data Model"
correct_answer: "B"
explanation: "Generalization/Subtyping models a general entity with specialized subtypes that share common attributes but also have distinct ones — a precise term for something engineers often do informally without naming it."
why_incorrect:
  - option: "A"
    reason: "Denormalization is about introducing redundancy for read performance, unrelated to entity-type structuring."
  - option: "C"
    reason: "Surrogate key assignment concerns identifier design, not entity typing."
  - option: "D"
    reason: "A Canonical Data Model is a shared integration reference model, a different concept from entity supertyping/subtyping."
