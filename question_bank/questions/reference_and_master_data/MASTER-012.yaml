question_type: "Multiple Choice"
stem: "What is a Data Sharing Agreement, in the context of Master Data Management?"
answer_choices:
  - "A) A technical script that performs record matching"
  - "B) A governance artifact documenting the terms — freshness, quality, usage restrictions — under which shared master/reference data is distributed to consumers"
  - "C) A synonym for a Survivorship Rule"
  - "D) A database backup schedule"
correct_answer: "B"
explanation: "A Data Sharing Agreement is a governance artifact — a documented, approved agreement between a master data provider and its consumers specifying what data is shared, under what terms, at what quality/freshness level, and under what usage restrictions."
why_incorrect:
  - option: "A"
    reason: "A matching script is a technical implementation detail, not a governance agreement about distribution terms."
  - option: "C"
    reason: "A Survivorship Rule resolves conflicting attribute values during golden record creation, an entirely different concern from distribution terms."
  - option: "D"
    reason: "A backup schedule is a Data Storage and Operations concern, unrelated to data-sharing terms."
