estimated_solving_time: 45
question_type: "Multiple Select"
stem: "Select the three items below that are data movement/integration patterns, as distinct from architecture styles or governance artifacts. (Select three.)"
answer_choices:
  - "A) Batch integration"
  - "B) Hub-and-spoke / Enterprise Service Bus"
  - "C) Change Data Capture (CDC)"
  - "D) Data Federation / Virtualization"
  - "E) Data Sharing Agreement"
correct_answer: ["A", "C", "D"]
explanation: "Batch integration, CDC, and Data Federation/Virtualization all describe how or when data actually moves (or is accessed without moving) — the data movement pattern axis, distinct from architectural connection organization or governance documentation."
why_incorrect:
  - option: "B"
    reason: "Hub-and-spoke/ESB describes how connections between systems are architecturally organized, a distinct axis from data movement timing/mechanism."
  - option: "E"
    reason: "A Data Sharing Agreement is a governance artifact documenting terms of data sharing, not a data movement pattern itself."
