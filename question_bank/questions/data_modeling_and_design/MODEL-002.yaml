question_type: "Multiple Choice"
stem: "In data modeling terminology, what is an 'Entity'?"
answer_choices:
  - "A) A property of a business object, such as a name or date"
  - "B) A distinct business 'thing' the organization needs to hold data about"
  - "C) A system-generated identifier with no business meaning"
  - "D) A rule that eliminates redundancy in a table"
correct_answer: "B"
explanation: "An Entity is a distinct business 'thing' the organization needs to hold data about, such as Customer or Order — the basic building block of a conceptual and logical model."
why_incorrect:
  - option: "A"
    reason: "This describes an Attribute, a property of an entity, not the entity itself."
  - option: "C"
    reason: "This describes a Surrogate Key, a specific kind of identifier, not an entity."
  - option: "D"
    reason: "This describes Normalization, a modeling process, not a structural term for a business object."
