question_type: "Scenario-Based"
stem: "A person is described as: 'defines and maintains business definitions for the Customer domain, enforces data standards, and reports outstanding issues to the accountable business owner.' Which role does this describe?"
answer_choices:
  - "A) Data Owner"
  - "B) Data Steward"
  - "C) Data Custodian"
  - "D) Data Architect"
correct_answer: "B"
explanation: "This is the classic Steward description — day-to-day oversight, definitions, and standards enforcement, delegated by and reporting to the Owner. This exact framing is one of DAMA's most frequently tested scenario patterns."
why_incorrect:
  - option: "A"
    reason: "The Owner holds ultimate accountability and delegates this legwork rather than performing it personally."
  - option: "C"
    reason: "The Custodian is a technical execution role, not a definitions/standards-setting role."
  - option: "D"
    reason: "The Architect designs enterprise data structures, unrelated to domain-level stewardship."
