estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A regional sales team builds its own 'Customer Revenue' report by extracting data directly from the CRM and billing systems, without going through the company's shared enterprise data warehouse. Six months later, its numbers no longer match Finance's warehouse-sourced report. What best explains this outcome?"
answer_choices:
  - "A) The team built a dependent data mart, which should have stayed synchronized automatically"
  - "B) The team built an independent data mart, which lacks a structural mechanism keeping it consistent with the warehouse"
  - "C) The team built an Operational Data Store, which is expected to diverge from warehouse figures"
  - "D) The discrepancy is unrelated to how the report was built and is purely a random data quality issue"
correct_answer: "B"
explanation: "Extracting directly from source systems, bypassing the shared warehouse, is precisely the definition of an independent data mart — and a documented risk, since nothing structurally forces it to stay consistent with the warehouse over time."
why_incorrect:
  - option: "A"
    reason: "A dependent data mart is sourced from the shared warehouse by definition, which this scenario explicitly did not do."
  - option: "C"
    reason: "An Operational Data Store is a distinct, integrated current-state store, not a department-built report bypassing the warehouse."
  - option: "D"
    reason: "The scenario describes a well-documented structural cause (independent mart proliferation), not an unrelated or random issue."
