estimated_solving_time: 45
question_type: "Multiple Select"
stem: "Select the three items below that are examples of BI delivery mechanisms, as distinct from warehouse data-store or modeling components. (Select three.)"
answer_choices:
  - "A) A scheduled standard/canned report"
  - "B) A staging area holding raw extracted data"
  - "C) An interactive dashboard"
  - "D) An ad hoc query tool used for self-service exploration"
  - "E) A fact table's grain definition"
correct_answer: ["A", "C", "D"]
explanation: "Standard/canned reports, dashboards, and ad hoc query tools are all BI delivery mechanisms — the consumption/delivery layer that turns warehoused data into consumable insight for end users."
why_incorrect:
  - option: "B"
    reason: "A staging area is part of the ETL/ELT pipeline that populates the warehouse, not a BI delivery mechanism consumed by end users."
  - option: "E"
    reason: "A fact table's grain is a data modeling concept defining the level of detail recorded, not a BI delivery mechanism."
