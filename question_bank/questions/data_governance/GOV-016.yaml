question_type: "Scenario-Based"
stem: "A bank must comply with BCBS 239's requirement to demonstrate lineage, accountability, and quality controls for risk-reporting data. Which of the following governance elements would most directly support this compliance goal? (Select all that apply.)"
answer_choices:
  - "A) A named Data Owner accountable for the risk-reporting data domain"
  - "B) A Governance Council including Risk, Compliance, and senior data leadership"
  - "C) Allowing each business unit's engineering team to independently decide what counts as accurate risk data"
  - "D) Documented, traceable lineage showing how risk figures were produced"
correct_answer: ["A", "B", "D"]
explanation: "BCBS 239 essentially mandates DAMA-style governance by regulation — a named accountable Owner, a senior cross-functional Council, and demonstrable lineage are exactly the artifacts a regulator asking 'who is accountable, and how was this number produced' requires."
why_incorrect:
  - option: "C"
    reason: "Delegating accuracy definitions independently to engineering teams recreates the exact fragmented-accountability problem governance and BCBS 239 both exist to prevent."
