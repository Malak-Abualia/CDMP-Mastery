stem: "What is Business Metadata?"
answer_choices:
  - "A) Metadata describing technical structure such as schemas and data types"
  - "B) Metadata that describes data in business terms — definitions, business rules, ownership, and classification"
  - "C) Metadata describing job run status and row counts"
  - "D) The physical storage location of a database file"
correct_answer: "B"
explanation: "Business Metadata describes data in business terms — definitions, business rules, ownership, and classification — focused on meaning for business consumers rather than technical implementation."
why_incorrect:
  - option: "A"
    reason: "This describes Technical Metadata, a separate category focused on structure rather than meaning."
  - option: "C"
    reason: "This describes Operational Metadata, which concerns execution/runtime facts, not business meaning."
  - option: "D"
    reason: "Physical file storage location is an infrastructure detail, not a metadata category at all."
