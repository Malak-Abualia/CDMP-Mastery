industry_practice_concept: "ELT vs. ETL tradeoffs"
keywords: ["ELT", "ETL", "architecture tradeoff", "reprocessing", "personal preference"]
estimated_solving_time: 80
question_type: "Multiple Select"
stem: "Select the two considerations below that most legitimately favor choosing ELT over ETL for a new warehouse load. (Select two.)"
answer_choices:
  - "A) The target platform can cheaply and flexibly handle large-scale in-warehouse transformation"
  - "B) Transformation logic must be reused identically, unchanged, across several different downstream targets outside the warehouse"
  - "C) The team is more comfortable writing SQL-based transformations after loading than building a separate transformation service"
  - "D) Preserving the raw, untransformed data in the warehouse supports easier reprocessing if transformation logic changes later"
correct_answer: ["A", "D"]
explanation: "Cheap, flexible in-platform compute and the ability to reprocess from preserved raw data are both legitimate technical/architectural drivers for favoring ELT's load-then-transform ordering."
why_incorrect:
  - option: "B"
    reason: "Needing identical transformation logic reused across several external downstream targets is actually a consideration favoring ETL, since transforming once centrally before distributing avoids re-implementing the same logic per target."
  - option: "C"
    reason: "Team comfort with a particular tooling style is a personal/team preference, not a legitimate architectural driver — the module explicitly cautions against defaulting to whichever pattern is personally more familiar."
