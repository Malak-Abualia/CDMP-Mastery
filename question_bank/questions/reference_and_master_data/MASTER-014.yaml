question_type: "Multiple Choice"
stem: "Who should typically be accountable for approving survivorship rules for the Customer Master domain?"
answer_choices:
  - "A) The Data Engineer building the matching pipeline"
  - "B) The Data Owner for the Customer domain"
  - "C) The MDM software vendor"
  - "D) Whichever source system was implemented first"
correct_answer: "B"
explanation: "Survivorship rules encode business judgments about source trustworthiness — an accountability decision that belongs to the business-side Data Owner, consistent with the Owner/Custodian boundary established in Data Governance."
why_incorrect:
  - option: "A"
    reason: "The Data Engineer implements approved rules but should not unilaterally decide business-level survivorship logic."
  - option: "C"
    reason: "A vendor's tool provides mechanism, not the accountable business decision."
  - option: "D"
    reason: "Implementation order has no bearing on data authority or accountability."
