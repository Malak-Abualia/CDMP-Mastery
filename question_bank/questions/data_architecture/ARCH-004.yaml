question_type: "Multiple Choice"
stem: "What are the stages of the Data Lifecycle, per DAMA's framing in Data Architecture?"
answer_choices:
  - "A) Extract, Transform, Load"
  - "B) Creation/capture, processing/use, maintenance, archival, disposal/retirement"
  - "C) Conceptual, Logical, Physical"
  - "D) Plan, Build, Run"
correct_answer: "B"
explanation: "Data Architecture is responsible for planning across the full data lifecycle — creation/capture, processing/use, maintenance, archival, and disposal/retirement — including the later stages individual project teams routinely under-plan for."
why_incorrect:
  - option: "A"
    reason: "Extract, Transform, Load describes a data integration pattern, not the full data lifecycle."
  - option: "C"
    reason: "Conceptual/Logical/Physical describes levels of modeling or architecture abstraction, a different concept from lifecycle stages."
  - option: "D"
    reason: "Plan, Build, Run is a generic IT delivery framing, not DAMA's specific data lifecycle stages."
