question_type: "Multiple Choice"
stem: "What is a Golden Record?"
answer_choices:
  - "A) The single, agreed, authoritative version of a master data entity's attributes, produced through matching and survivorship"
  - "B) A controlled list of permitted status codes"
  - "C) A raw, unprocessed source system record"
  - "D) A governance policy document"
correct_answer: "A"
explanation: "The Golden Record is the single, agreed, authoritative version of a master data entity's attributes — the record an organization treats as 'the truth' once candidate source records have been matched, merged, and reconciled."
why_incorrect:
  - option: "B"
    reason: "This describes a Value Domain, a Reference Data concept, not the MDM output known as a Golden Record."
  - option: "C"
    reason: "A raw source record is exactly what the Golden Record is synthesized from, not the Golden Record itself."
  - option: "D"
    reason: "A governance policy document is a Data Governance artifact, not an MDM entity record."
