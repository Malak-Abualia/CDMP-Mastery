question_type: "Multiple Select"
stem: "A company is implementing column-level access control for PII fields. Select the two statements below that correctly assign the decision to the right role."
answer_choices:
  - "A) Deciding which fields are classified as PII — Owner/Steward"
  - "B) Implementing masking and row/column-level security — Custodian"
  - "C) Deciding which fields are classified as PII — Custodian"
  - "D) Implementing masking and row/column-level security — Owner/Steward"
correct_answer: ["A", "B"]
explanation: "Classification (what needs protecting, and why) is a business/governance decision belonging to Owner/Steward; technical implementation (how it's protected) is executed by the Custodian."
why_incorrect:
  - option: "C"
    reason: "This swaps the correct role assignment — classification is a business/governance decision, not a Custodian decision."
  - option: "D"
    reason: "This also swaps the correct role assignment — technical implementation belongs to the Custodian, not the Owner/Steward."
