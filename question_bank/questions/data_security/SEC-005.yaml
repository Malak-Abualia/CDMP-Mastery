question_type: "Multiple Choice"
stem: "What is Encryption?"
answer_choices:
  - "A) Replacing a sensitive value with a non-sensitive token stored in a separate vault"
  - "B) Mathematically transforming data using a key so it is unreadable without the correct decryption key"
  - "C) Irreversibly removing identifying information from a dataset"
  - "D) Granting a user only the minimum access needed for their function"
correct_answer: "B"
explanation: "Encryption mathematically transforms data using a key, making it unreadable without the correct decryption key, applied both at rest and in transit."
why_incorrect:
  - option: "A"
    reason: "This describes Tokenization, a distinct reversible substitution technique."
  - option: "C"
    reason: "This describes Anonymization, a distinct irreversible technique."
  - option: "D"
    reason: "This describes Least Privilege, an access-scoping principle, not a data transformation technique."
