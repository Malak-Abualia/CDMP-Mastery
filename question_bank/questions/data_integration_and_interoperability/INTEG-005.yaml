question_type: "Multiple Choice"
stem: "What is Change Data Capture (CDC)?"
answer_choices:
  - "A) Capturing and propagating changes in a source system as they occur, without re-extracting the entire dataset"
  - "B) A central hub that routes and mediates data between systems"
  - "C) A governance artifact documenting data sharing terms between organizations"
  - "D) The scheduled, bulk transfer of an entire dataset at fixed intervals"
correct_answer: "A"
explanation: "CDC captures and propagates only the changes in a source system as they occur, avoiding the need to repeatedly re-extract the entire dataset."
why_incorrect:
  - option: "B"
    reason: "This describes a Hub-and-Spoke/ESB architecture style, a distinct concept from CDC's change-propagation mechanism."
  - option: "C"
    reason: "This describes a Data Sharing Agreement, a governance artifact, not a technical data movement mechanism."
  - option: "D"
    reason: "This describes Batch Integration, which CDC is often used as an alternative or complement to for reducing latency."
