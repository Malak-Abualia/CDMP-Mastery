topic: "Data Movement"
subtopic: "ETL vs. ELT"
difficulty: "Intermediate"
blooms_level: "Understand"
learning_objective: "Distinguish ELT from ETL based on the ordering of load and transform steps."
dama_concept: null
industry_practice_concept: "ELT (Extract, Load, Transform)"
keywords: ["ELT", "ETL", "cloud platform", "in-warehouse transformation"]
estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A cloud data platform loads raw extracted data directly into warehouse tables, then runs all cleansing and conforming logic afterward using SQL executed by the platform itself. This pattern is best described as:"
answer_choices:
  - "A) ETL, because the platform still transforms the data eventually"
  - "B) ELT, because loading happens before transformation"
  - "C) OLAP, because SQL is used for the transformation"
  - "D) An Operational Data Store pattern"
correct_answer: "B"
explanation: "ELT (Extract, Load, Transform) is defined by loading raw data first and transforming it afterward using the target platform's own compute — exactly the ordering described."
why_incorrect:
  - option: "A"
    reason: "ETL requires transformation to happen before loading; the ordering described here is reversed, which is the defining feature of ELT, not ETL."
  - option: "C"
    reason: "OLAP describes analytical query processing, not a data-loading pattern; using SQL for transformation does not make a load pattern OLAP."
  - option: "D"
    reason: "An ODS is a type of integrated data store, unrelated to how transformation is sequenced during loading."
