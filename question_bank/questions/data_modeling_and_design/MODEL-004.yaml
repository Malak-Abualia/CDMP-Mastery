question_type: "Multiple Choice"
stem: "In a star schema, what does a fact table typically contain?"
answer_choices:
  - "A) Descriptive, mostly-textual context such as customer name and product category"
  - "B) Measurable, numeric events at a defined grain, typically with foreign keys to dimensions"
  - "C) Only entity relationships with no attributes"
  - "D) Business glossary term definitions"
correct_answer: "B"
explanation: "A fact table holds measurable, numeric events (such as a sale) at a defined grain — the level of detail one row represents — typically linked to dimension tables via foreign keys."
why_incorrect:
  - option: "A"
    reason: "Descriptive, mostly-textual context is what a dimension table holds, not a fact table."
  - option: "C"
    reason: "This describes a Conceptual Data Model, not a physical dimensional-modeling artifact."
  - option: "D"
    reason: "Business glossary definitions belong to Metadata Management's Business Metadata, not a fact table."
