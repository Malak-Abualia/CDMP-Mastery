keywords: ["ownership record", "classification by meaning", "storage location trap"]
estimated_solving_time: 45
question_type: "Scenario-Based"
stem: "A data ownership field is technically stored as an ordinary column in a relational database table alongside technical schema metadata. What metadata category does this ownership field belong to?"
answer_choices:
  - "A) Technical Metadata, because it is physically stored in a database table"
  - "B) Business Metadata, because it concerns accountability and meaning, regardless of where it is technically stored"
  - "C) Operational Metadata, because a database wrote it"
  - "D) It cannot be classified into any of the three categories"
correct_answer: "B"
explanation: "Classification depends on what a piece of metadata describes (meaning/accountability vs. structure), not where it happens to be physically stored — a data ownership record is Business Metadata even when stored as a column in a technical system."
why_incorrect:
  - option: "A"
    reason: "Storage location does not determine category — this is the specific exam trap DAMA content warns against."
  - option: "C"
    reason: "The fact that a database process wrote the value doesn't make it Operational Metadata — Operational Metadata concerns execution/runtime facts, not ownership meaning."
  - option: "D"
    reason: "Every piece of metadata classifies into one of the three categories based on what it describes; this ownership record clearly describes accountability, which is Business Metadata."
