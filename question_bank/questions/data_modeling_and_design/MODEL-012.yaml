stem: "Which of the following statements about denormalization are accurate, per DAMA's framing? (Select all that apply.)"
answer_choices:
  - "A) Denormalization deliberately introduces redundancy, typically to optimize read performance"
  - "B) Denormalization is always a modeling mistake and should never be used"
  - "C) DMBOK2 treats denormalization as a legitimate, deliberate physical-modeling decision"
  - "D) Denormalization is common in analytical/warehouse models"
correct_answer: ["A", "C", "D"]
explanation: "A, C, and D correctly describe denormalization as an intentional physical-design tradeoff commonly used in analytics, explicitly endorsed by DMBOK2 as legitimate when the tradeoff is understood."
why_incorrect:
  - option: "B"
    reason: "This treats denormalization as unconditionally wrong, contradicting DMBOK2's explicit framing of it as a legitimate, deliberate choice — a well-documented exam trap."
