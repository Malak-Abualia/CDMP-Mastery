question_type: "Multiple Choice"
stem: "What is Operational Metadata?"
answer_choices:
  - "A) Metadata describing what a table's columns mean to the business"
  - "B) Metadata describing the execution and runtime characteristics of data processes — not what data structurally is, but what has actually happened to it"
  - "C) A database's column data types"
  - "D) A business rule defining how revenue is calculated"
correct_answer: "B"
explanation: "Operational Metadata describes execution and runtime characteristics — ETL job start/end times, row counts processed or rejected, freshness timestamps, and access audit logs — the category most often neglected by organizations that think of metadata purely as static documentation."
why_incorrect:
  - option: "A"
    reason: "This describes Business Metadata, which concerns meaning, not runtime execution facts."
  - option: "C"
    reason: "Column data types are Technical Metadata, describing structure, not execution."
  - option: "D"
    reason: "A business rule definition is Business Metadata, not a runtime/execution fact."
