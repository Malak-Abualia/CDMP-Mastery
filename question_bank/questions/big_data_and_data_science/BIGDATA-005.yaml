question_type: "Multiple Choice"
stem: "What is Overfitting?"
answer_choices:
  - "A) A model that has learned the specific noise/quirks of its training data rather than the general underlying pattern, performing well on training data but poorly on new, unseen data"
  - "B) The gradual degradation of a deployed model's accuracy as real-world conditions change"
  - "C) The practice of transforming raw data into a model's input variables"
  - "D) A model's decision logic being difficult to understand or explain"
correct_answer: "A"
explanation: "Overfitting occurs when a model learns training data's specific noise rather than the general pattern, resulting in good training performance but poor performance on new, unseen data."
why_incorrect:
  - option: "B"
    reason: "This describes Model Drift, a distinct post-deployment phenomenon, not a training-time issue."
  - option: "C"
    reason: "This describes Feature Engineering, a distinct data preparation step."
  - option: "D"
    reason: "This describes low Explainability, a distinct model characteristic unrelated to overfitting."
