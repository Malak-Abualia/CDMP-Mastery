question_type: "Multiple Choice"
stem: "What does the Timeliness data quality dimension measure?"
answer_choices:
  - "A) Whether data is factually correct"
  - "B) The degree to which data is available and current enough for its intended use, within an expected time window"
  - "C) Whether a value conforms to an expected format"
  - "D) Whether an entity is represented only once in a dataset"
correct_answer: "B"
explanation: "Timeliness is the degree to which data is available and current enough for its intended use within a defined freshness window — a daily sales report arriving after decisions have already been made is a Timeliness failure even if every value in it is otherwise correct."
why_incorrect:
  - option: "A"
    reason: "Factual correctness describes Accuracy, a separate dimension from Timeliness."
  - option: "C"
    reason: "Conformance to expected format describes Validity, not Timeliness."
  - option: "D"
    reason: "Single representation of an entity describes Uniqueness, not Timeliness."
