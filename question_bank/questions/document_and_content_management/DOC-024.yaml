question_type: "Multiple Choice"
stem: "A cloud data platform company wants a single term for the broad category of platforms and practices for managing an organization's content holistically across its entire lifecycle, as distinct from a system focused narrowly on just documents, just web content, or just media assets. Which term correctly describes this broad, holistic category?"
answer_choices:
  - "A) Digital Asset Management (DAM)"
  - "B) Enterprise Content Management (ECM)"
  - "C) Web Content Management (WCM)"
  - "D) Document Management System (DMS)"
correct_answer: "B"
explanation: "Enterprise Content Management (ECM) is specifically the broad category of platforms and practices for managing an organization's content holistically across its lifecycle, while DAM, WCM, and DMS are each narrower categories scoped to media assets, website content, and documents respectively."
why_incorrect:
  - option: "A"
    reason: "DAM is narrowly scoped to media assets (images, video, audio) and their associated rights/usage metadata, not the holistic category."
  - option: "C"
    reason: "WCM is narrowly scoped to managing website content publication and lifecycle."
  - option: "D"
    reason: "DMS is narrowly scoped to document-centric content: versioning, check-in/check-out, and controlled access for discrete documents."
