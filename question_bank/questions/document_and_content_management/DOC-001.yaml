question_type: "Multiple Choice"
stem: "What is a Document?"
answer_choices:
  - "A) A unit of recorded information, structured or unstructured, that can be treated as a single object"
  - "B) A structured classification scheme for organizing content"
  - "C) A directive suspending normal retention for content relevant to litigation"
  - "D) A governance artifact specifying how long a record must be retained"
correct_answer: "A"
explanation: "A Document is a unit of recorded information, structured or unstructured, treated as a single object — such as a contract, report, or image."
why_incorrect:
  - option: "B"
    reason: "This describes a Taxonomy, a distinct organizational concept, not a document itself."
  - option: "C"
    reason: "This describes a Legal Hold, a distinct governance mechanism."
  - option: "D"
    reason: "This describes a Records Retention Schedule, a distinct governance artifact."
