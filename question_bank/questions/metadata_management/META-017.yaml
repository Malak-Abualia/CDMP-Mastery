question_type: "Multiple Select"
stem: "An organization with dozens of disconnected systems and no existing catalog wants to design an enterprise metadata management strategy. Which of the following are sound starting principles? (Select all that apply.)"
answer_choices:
  - "A) Start with scope and prioritization — which domains/systems to address first, based on risk and value"
  - "B) Attempt a single, simultaneous, all-systems-at-once rollout"
  - "C) Favor automated metadata integration/scanning over manual entry wherever feasible"
  - "D) Establish an ownership/review cadence for whatever can't be automated"
correct_answer: ["A", "C", "D"]
explanation: "A, C, and D reflect sound practice: prioritized scoping (echoing the same 'don't govern everything at once' lesson from Data Governance), automation-first metadata capture, and a defined review cadence for what automation can't cover."
why_incorrect:
  - option: "B"
    reason: "A big-bang, all-systems-at-once rollout is a documented anti-pattern that tends to stall under its own scope, the same failure mode seen in over-ambitious governance rollouts."
