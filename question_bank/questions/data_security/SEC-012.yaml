estimated_solving_time: 45
question_type: "Multiple Select"
stem: "Select the two data protection techniques below that are reversible under the correct controlled conditions, as opposed to being irreversible by design. (Select two.)"
answer_choices:
  - "A) Anonymization"
  - "B) Tokenization"
  - "C) Pseudonymization"
  - "D) Data Masking (for non-production use)"
correct_answer: ["B", "C"]
explanation: "Tokenization is reversible via a securely separated token vault, and Pseudonymization is reversible via securely separated additional information — both are deliberately designed to allow controlled reversal, unlike Anonymization or typical non-production Data Masking."
why_incorrect:
  - option: "A"
    reason: "Anonymization is defined by irreversibility — it removes identifying information such that re-identification is not possible by design."
  - option: "D"
    reason: "Data Masking for non-production use is typically a one-way substitution, with no mechanism to recover the original value from the masked copy."
