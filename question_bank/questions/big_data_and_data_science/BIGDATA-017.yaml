question_type: "Multiple Select"
stem: "Select the two practices below that constitute genuine Model Governance, as distinct from technical modeling decisions that don't by themselves provide governance. (Select two.)"
answer_choices:
  - "A) Documenting a model's intended use, limitations, and an accountable Data Owner before deployment"
  - "B) Achieving the highest possible aggregate accuracy score during training"
  - "C) Establishing a defined review cadence and ongoing drift monitoring for a deployed model"
  - "D) Using the most computationally efficient algorithm available"
correct_answer: ["A", "C"]
explanation: "Documenting ownership/purpose/limitations and establishing ongoing review/monitoring are both governance practices treating a model as an accountable, managed asset — distinct from technical performance or efficiency optimization, which do not by themselves provide governance or accountability."
why_incorrect:
  - option: "B"
    reason: "Maximizing accuracy is a technical modeling objective; a highly accurate model with no documented owner or monitoring is still ungoverned, as the module's own banking and healthcare examples illustrate."
  - option: "D"
    reason: "Algorithm efficiency is a technical implementation choice, unrelated to accountability, explainability, or ongoing oversight — governance concerns, not performance concerns."
