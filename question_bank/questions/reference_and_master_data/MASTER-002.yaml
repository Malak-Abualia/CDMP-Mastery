question_type: "Multiple Choice"
stem: "What is Master Data?"
answer_choices:
  - "A) A controlled set of permitted classification values"
  - "B) The authoritative, agreed representation of an organization's core shared business entities, such as Customer or Product"
  - "C) A record of ETL job execution times"
  - "D) A business glossary definition"
correct_answer: "B"
explanation: "Master Data is the authoritative, agreed representation of an organization's core shared business entities — the 'nouns' of the business that show up again and again across many systems and processes."
why_incorrect:
  - option: "A"
    reason: "This describes Reference Data, a distinct, smaller-scope concept concerned with controlled values, not shared entities."
  - option: "C"
    reason: "This describes Operational Metadata, unrelated to the concept of a shared core business entity."
  - option: "D"
    reason: "This describes Business Metadata, which defines meaning, not the authoritative entity data itself."
