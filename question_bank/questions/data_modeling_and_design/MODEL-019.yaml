stem: "Which of the following statements about Data Vault modeling are accurate? (Select all that apply.)"
answer_choices:
  - "A) Data Vault uses a Hub/Link/Satellite structure designed for auditability and flexibility to source-system change"
  - "B) Data Vault is DAMA's officially mandated modeling methodology for all warehouses"
  - "C) DMBOK2 mentions modeling approaches like Data Vault but does not mandate any specific one"
  - "D) Data Vault, like dimensional modeling, is an industry-originated methodology referenced by DMBOK2 rather than invented by it"
correct_answer: ["A", "C", "D"]
explanation: "A, C, and D correctly reflect Data Vault's structure and its status as an industry-practice methodology that DMBOK2 references neutrally rather than mandates."
why_incorrect:
  - option: "B"
    reason: "DMBOK2 does not mandate Data Vault or any single modeling methodology — it presents modeling techniques neutrally, making this option a documented exam trap."
