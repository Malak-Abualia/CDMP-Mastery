stem: "What is a Record?"
answer_choices:
  - "A) Any file stored in a content management system"
  - "B) A document or piece of content designated as evidence of a business transaction, decision, or event, retained per policy and typically not alterable after designation"
  - "C) A structured classification scheme for organizing content"
  - "D) A search index over unstructured content"
correct_answer: "B"
explanation: "A Record is specifically a document or piece of content designated as evidence of a business transaction/decision, retained per a governed policy and typically immutable once designated."
why_incorrect:
  - option: "A"
    reason: "Not every stored file is a record; the defining test is evidentiary and retention-obligation status, not storage location."
  - option: "C"
    reason: "This describes a Taxonomy, a distinct organizational concept."
  - option: "D"
    reason: "This describes search infrastructure, an unrelated retrieval mechanism."
