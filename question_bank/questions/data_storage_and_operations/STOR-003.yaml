question_type: "Multiple Choice"
stem: "What is Database Administration (DBA), as a discipline?"
answer_choices:
  - "A) The business-side accountability for a data domain's definition and quality"
  - "B) The discipline responsible for the technical implementation, configuration, performance, and operational health of database environments"
  - "C) The process of matching and merging duplicate customer records"
  - "D) The design of conceptual and logical data models"
correct_answer: "B"
explanation: "Database Administration is the discipline (and often formal role) responsible for the technical implementation, configuration, performance, and operational health of database environments."
why_incorrect:
  - option: "A"
    reason: "This describes the Data Owner role from Data Governance, a business-accountability role, not the technical DBA discipline."
  - option: "C"
    reason: "This describes Matching and Merging, a Master Data Management concept, unrelated to database administration."
  - option: "D"
    reason: "This describes Data Modeling and Design, a distinct Knowledge Area from database operational administration."
