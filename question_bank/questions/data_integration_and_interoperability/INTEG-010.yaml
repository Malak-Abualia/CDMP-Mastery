estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "A manufacturer needs to exchange purchase orders and shipment notifications with dozens of suppliers using a shared, industry-standard business document format, rather than a custom format per supplier. Which named standard is most directly relevant?"
answer_choices:
  - "A) HL7"
  - "B) SWIFT"
  - "C) EDI (Electronic Data Interchange)"
  - "D) GDPR"
correct_answer: "C"
explanation: "EDI is the family of standards specifically for structured business document exchange (purchase orders, invoices) between organizations, especially prevalent in retail and manufacturing supply chains."
why_incorrect:
  - option: "A"
    reason: "HL7 is a healthcare-specific clinical data exchange standard, unrelated to supplier purchase orders."
  - option: "B"
    reason: "SWIFT is the interbank payment messaging standard, unrelated to supply chain business documents."
  - option: "D"
    reason: "GDPR is a personal data privacy regulation, not a business document exchange standard."
