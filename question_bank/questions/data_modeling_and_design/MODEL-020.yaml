estimated_solving_time: 75
question_type: "Scenario-Based"
stem: "HL7 FHIR precisely defines resources like 'Patient' and 'Encounter' so that different hospital systems can exchange data without bespoke point-to-point translation for every integration. What does this best illustrate?"
answer_choices:
  - "A) A DAMA-invented healthcare-specific Knowledge Area"
  - "B) A real-world example of a well-governed canonical model achieving integration benefits at industry scale"
  - "C) A physical database index optimized for healthcare queries"
  - "D) A governance council specific to hospital IT departments"
correct_answer: "B"
explanation: "HL7 FHIR is a real, widely adopted industry standard that functions as a published canonical logical/physical model for healthcare data, illustrating what a well-governed canonical model achieves at industry scale, not just within one organization."
why_incorrect:
  - option: "A"
    reason: "HL7 FHIR is an independent industry standard, not a DAMA invention or a DMBOK2-defined Knowledge Area."
  - option: "C"
    reason: "FHIR defines data structure and exchange patterns, not a specific physical database index."
  - option: "D"
    reason: "FHIR is a data standard, not a governance body or council."
