question_type: "Multiple Choice"
stem: "What does Recovery Point Objective (RPO) measure?"
answer_choices:
  - "A) The maximum acceptable amount of downtime after a failure"
  - "B) The maximum acceptable amount of data loss, measured in time, following a failure"
  - "C) The average time to answer an analytical query"
  - "D) The percentage of total storage capacity currently in use"
correct_answer: "B"
explanation: "RPO answers 'how much data can we afford to lose,' driven by backup or replication frequency."
why_incorrect:
  - option: "A"
    reason: "This describes Recovery Time Objective (RTO), a distinct and independent recovery target."
  - option: "C"
    reason: "This describes a query performance metric, unrelated to recovery targets."
  - option: "D"
    reason: "This describes storage capacity utilization, unrelated to recovery targets."
