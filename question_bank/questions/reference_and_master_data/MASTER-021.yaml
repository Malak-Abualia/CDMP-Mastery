estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "An organization physically extracts customer data from multiple source systems into a separate, centralized store where matching and golden-record creation happen, primarily to support enterprise reporting — while source systems continue independently updating their own local copies. Which MDM implementation style does this describe?"
answer_choices:
  - "A) Registry style"
  - "B) Consolidation style"
  - "C) Coexistence style"
  - "D) Centralized style"
correct_answer: "B"
explanation: "Consolidation style physically extracts and merges master data into a centralized store, typically for reporting/analytics, while source systems continue operating and updating their own local copies independently — exactly as described."
why_incorrect:
  - option: "A"
    reason: "Registry style stores only cross-reference keys, not a physically consolidated store."
  - option: "C"
    reason: "Coexistence also synchronizes back to source systems bidirectionally, which this scenario doesn't describe."
  - option: "D"
    reason: "Centralized style makes the golden record the single system of record that applications read/write directly against, not a separate reporting-focused store."
