estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Who should be accountable for setting the data retention period for a regulated category of customer data?"
answer_choices:
  - "A) Whichever engineer happens to configure the database"
  - "B) The accountable Data Owner, typically in consultation with compliance/legal"
  - "C) The cloud storage provider, since they control the underlying infrastructure"
  - "D) No one; retention periods are automatically determined by the database technology in use"
correct_answer: "B"
explanation: "Retention duration is a governed, business-impact and compliance-driven decision, properly set by the accountable Data Owner in consultation with compliance/legal, not left to whichever engineer happens to configure the system."
why_incorrect:
  - option: "A"
    reason: "An engineer implements the approved retention schedule but should not unilaterally decide what that schedule should be."
  - option: "C"
    reason: "The cloud provider is responsible for platform operation under the shared responsibility model, not for the customer organization's governance decisions."
  - option: "D"
    reason: "Retention periods are a policy decision, not an automatic byproduct of database technology choice."
