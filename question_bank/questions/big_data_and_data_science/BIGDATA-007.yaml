estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "A data science team wants to store raw sensor logs, unstructured customer support transcripts, and structured transaction records together, without deciding on a fixed structure until they know exactly what analysis they'll run. Which storage pattern best fits this need?"
answer_choices:
  - "A) Data Warehouse, using schema-on-write"
  - "B) Data Lake, using schema-on-read"
  - "C) An Operational Data Store"
  - "D) A conformed dimension"
correct_answer: "B"
explanation: "A Data Lake's schema-on-read approach — storing raw data in native format without a predefined schema at ingestion — directly matches the need to store varied data types without committing to structure until analysis time."
why_incorrect:
  - option: "A"
    reason: "A Data Warehouse enforces schema-on-write, requiring structure to be defined before load, the opposite of the described flexible, undefined-future-use need."
  - option: "C"
    reason: "An Operational Data Store is a current-state-focused, frequently-refreshed operational store, not a flexible multi-format analytical repository."
  - option: "D"
    reason: "A conformed dimension is a Data Warehousing and Business Intelligence dimensional modeling concept, unrelated to raw, flexible storage."
