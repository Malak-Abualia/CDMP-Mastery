question_type: "Scenario-Based"
stem: "An organization moves its database to a fully managed cloud DBaaS platform. Under the shared responsibility model, which of the following remains the organization's responsibility, not the cloud provider's?"
answer_choices:
  - "A) Patching the underlying database engine software"
  - "B) Deciding data classification, retention policy, and access configuration for the data stored on the platform"
  - "C) Maintaining the physical data center infrastructure"
  - "D) Operating the underlying storage hardware"
correct_answer: "B"
explanation: "The shared responsibility model means the provider typically secures and operates the underlying platform (patching, physical infrastructure, hardware), but the customer organization remains responsible for data classification, access configuration, and retention policy decisions."
why_incorrect:
  - option: "A"
    reason: "In a fully managed DBaaS model, the provider typically handles engine patching as part of the managed service."
  - option: "C"
    reason: "Physical data center infrastructure is the provider's responsibility in a cloud-hosted DBaaS model."
  - option: "D"
    reason: "Underlying storage hardware operation is the provider's responsibility in a cloud-hosted DBaaS model."
