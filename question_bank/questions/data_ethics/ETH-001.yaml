stem: "What is Data Ethics (Data Handling Ethics)?"
answer_choices:
  - "A) The technical process of verifying a user's identity before granting access"
  - "B) Standards of right and wrong conduct regarding how an organization collects, stores, manages, uses, and disposes of data, with explicit attention to impact on individuals and society, beyond mere legal compliance"
  - "C) A governed policy specifying how long a record must be retained"
  - "D) The technique of substituting sensitive values with realistic but fake data"
correct_answer: "B"
explanation: "Data Ethics concerns standards of right and wrong conduct in data handling, with explicit attention to impact on individuals and society, extending beyond legal compliance alone."
why_incorrect:
  - option: "A"
    reason: "This describes Authentication, a Data Security concept, unrelated to ethical evaluation."
  - option: "C"
    reason: "This describes a Records Retention Schedule, a Document and Content Management concept."
  - option: "D"
    reason: "This describes Data Masking, a Data Storage and Operations/Data Security technique."
