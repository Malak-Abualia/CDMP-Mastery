question_type: "Scenario-Based"
stem: "A data engineer adds a column comment directly in the schema stating 'active_flag: true only if the customer placed an order in the trailing 90 days.' What is this an example of?"
answer_choices:
  - "A) Operational Metadata, since it is stored in a technical system"
  - "B) Business Metadata embedded directly at the source, reducing reliance on a separately maintained, easily-outdated glossary entry"
  - "C) A Data Lineage record"
  - "D) A Data Architecture standard"
correct_answer: "B"
explanation: "Column and table comments are an easy, frequently neglected way to embed business metadata directly at the source — reducing reliance on a separate external glossary entry that no one remembers to check, even though the comment is technically stored inside a technical schema."
why_incorrect:
  - option: "A"
    reason: "The comment describes business meaning, not a runtime execution fact — classify by content, not storage location, per the same principle tested in META-008."
  - option: "C"
    reason: "This is a static definition, not a record of transformation history."
  - option: "D"
    reason: "A naming/design convention rule would be a Data Architecture Standard; a single column's business-meaning comment is not that."
