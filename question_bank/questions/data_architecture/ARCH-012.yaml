estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "Why is 'spaghetti architecture' considered a failure mode Data Architecture aims to prevent?"
answer_choices:
  - "A) It refers to slow SQL queries caused by missing indexes"
  - "B) It describes uncoordinated point-to-point integrations that grow unmanageable as systems are added"
  - "C) It only affects data quality validation checks"
  - "D) It is a synonym for a star schema"
correct_answer: "B"
explanation: "Without an architectural reference, every new integration is built point-to-point, and the number of connections grows combinatorially as systems are added — a well-known, expensive failure mode that a defined integration architecture (hub-and-spoke, event bus, canonical model) prevents."
why_incorrect:
  - option: "A"
    reason: "Slow queries from missing indexes are a Database Design/performance issue, unrelated to integration pattern chaos."
  - option: "C"
    reason: "The term concerns system integration structure, not data quality validation."
  - option: "D"
    reason: "A star schema is a dimensional modeling pattern, an entirely different concept from uncoordinated point-to-point integration."
