question_type: "Scenario-Based"
stem: "An organization is highly mature in Data Security (Level 4) but very immature in Document and Content Management (Level 1). A consultant proposes averaging these into a single 'Level 2.5' overall data management maturity score for the board. What is the most accurate critique of this approach?"
answer_choices:
  - "A) This is correct practice; a single blended score is the standard DAMA approach"
  - "B) Averaging obscures the exact information a maturity assessment exists to surface — the specific unevenness between a strong Data Security practice and a weak Document and Content Management practice — and should be reported per Knowledge Area instead"
  - "C) The average is mathematically incorrect and should be recalculated"
  - "D) Data Security and Document and Content Management cannot both be assessed by the same organization"
correct_answer: "B"
explanation: "Blending scores across Knowledge Areas hides exactly the specific strengths-and-gaps picture a maturity assessment is meant to produce; DAMA's approach is explicitly to report and act on per-Knowledge-Area results, not a single averaged figure."
why_incorrect:
  - option: "A"
    reason: "This is the central documented misconception this Knowledge Area exists to correct — DAMA's approach is explicitly per-Knowledge-Area, not blended."
  - option: "C"
    reason: "The issue isn't the arithmetic; even a mathematically correct average is the wrong reporting approach given what information it obscures."
  - option: "D"
    reason: "Both Knowledge Areas can and should be assessed for the same organization — the issue is how the results are reported, not whether both can be assessed."
