question_type: "Multiple Choice"
stem: "What is Authentication?"
answer_choices:
  - "A) The process of determining what an authenticated party is permitted to do"
  - "B) The process of verifying that a party is who or what it claims to be"
  - "C) The categorization of data according to its sensitivity"
  - "D) The mathematical transformation of data using a key"
correct_answer: "B"
explanation: "Authentication is the process of verifying that a user or system is who/what it claims to be, answering 'are you who you claim to be.'"
why_incorrect:
  - option: "A"
    reason: "This describes Authorization, a distinct, subsequent process."
  - option: "C"
    reason: "This describes Data Classification, unrelated to identity verification."
  - option: "D"
    reason: "This describes Encryption, a data protection technique, not identity verification."
