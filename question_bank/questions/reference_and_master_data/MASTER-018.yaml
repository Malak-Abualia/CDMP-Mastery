estimated_solving_time: 85
question_type: "Scenario-Based"
stem: "A hospital's Master Patient Index (MPI) uses deliberately conservative (strict) matching thresholds, even though this means more genuine duplicate patient records go unmerged. What is the most accurate justification for this design choice?"
answer_choices:
  - "A) Strict thresholds are always objectively 'better' matching regardless of context"
  - "B) A false-positive match — incorrectly merging two different patients — is a direct clinical safety risk, so minimizing false positives is prioritized even at the cost of more unmerged duplicates"
  - "C) This design choice has no real tradeoff, since strict thresholds eliminate all matching errors"
  - "D) Matching thresholds are irrelevant to patient safety"
correct_answer: "B"
explanation: "False-positive matches in an MPI context are a direct clinical safety risk — incorrectly merging two different patients could mean care is documented against, or withheld from, the wrong person — so survivorship and matching rules in healthcare are typically far more conservative than in lower-stakes contexts like marketing, accepting more false negatives as the safer tradeoff."
why_incorrect:
  - option: "A"
    reason: "Strictness is a contextual tradeoff, not an objective universal 'better' — a marketing use case might reasonably tolerate a looser threshold."
  - option: "C"
    reason: "Matching inherently involves an unavoidable tradeoff between false positives and false negatives; no threshold eliminates all errors."
  - option: "D"
    reason: "Matching thresholds directly determine clinical safety risk in an MPI context, as the scenario itself illustrates."
