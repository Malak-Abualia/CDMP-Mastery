keywords: ["uniqueness", "duplicate records", "entity resolution"]
estimated_solving_time: 40
question_type: "Scenario-Based"
stem: "The same customer appears in a dataset as three separate records: 'Jon Smith,' 'Jonathan Smith,' and 'J. Smith,' due to minor name variations across data entry points. Which dimension is violated?"
answer_choices:
  - "A) Completeness"
  - "B) Consistency"
  - "C) Uniqueness"
  - "D) Validity"
correct_answer: "C"
explanation: "Uniqueness measures the degree to which no entity is unintentionally represented more than once — three records for the same person due to name-variation is a textbook Uniqueness failure, typically detected via entity-matching/deduplication logic."
why_incorrect:
  - option: "A"
    reason: "Each record may be individually complete — the problem is duplication across records, not missing values within one record."
  - option: "B"
    reason: "Consistency concerns the same fact disagreeing across systems, not multiple records representing one entity."
  - option: "D"
    reason: "Each name variant may be individually well-formatted — the problem is duplication, not format."
