estimated_solving_time: 45
question_type: "Multiple Select"
stem: "Data Lineage is typically a combination of which metadata categories? (Select the two that apply.)"
answer_choices:
  - "A) Technical Metadata (what transformation ran)"
  - "B) Operational Metadata (when it ran, on what data)"
  - "C) Business Metadata alone"
  - "D) A fourth, independent metadata category"
correct_answer: ["A", "B"]
explanation: "Lineage is itself a form of metadata — typically a combination of Technical (what transformation ran) and Operational (when it ran, on what data) metadata — not a fourth independent category alongside the other three."
why_incorrect:
  - option: "C"
    reason: "Business Metadata alone cannot capture transformation and execution history — lineage requires Technical and Operational content specifically."
  - option: "D"
    reason: "This is a documented exam trap — lineage is a derived artifact combining two existing categories, not a fourth independent category."
