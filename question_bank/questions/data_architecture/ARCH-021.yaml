question_type: "Multiple Choice"
stem: "What is the Zachman Framework, in the context of Data Architecture?"
answer_choices:
  - "A) A DAMA-invented methodology unique to data governance"
  - "B) An external, matrix-based enterprise architecture framework organizing artifacts by perspective and question, which DMBOK2 references as compatible with Data Architecture work"
  - "C) A specific database technology for storing architecture diagrams"
  - "D) A certification exam administered by DAMA"
correct_answer: "B"
explanation: "The Zachman Framework, originated by John Zachman, is an external matrix-based enterprise architecture framework organizing artifacts by perspective (e.g., planner, owner, designer) and by question (what, how, where, who, when, why) — DMBOK2 references it as a compatible tool, not a DAMA invention."
why_incorrect:
  - option: "A"
    reason: "Attributing Zachman to DAMA is exactly the documented exam trap this Knowledge Area warns against."
  - option: "C"
    reason: "It is a conceptual, matrix-based framework, not a database technology."
  - option: "D"
    reason: "Unrelated to certification administration; it's an architecture-artifact organizing framework."
