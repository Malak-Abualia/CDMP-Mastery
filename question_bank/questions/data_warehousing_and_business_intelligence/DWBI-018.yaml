learning_objective: "Select credible business-value metrics to sustain executive sponsorship of a warehouse program."
dama_concept: "DW/BI Success Metrics"
industry_practice_concept: "DW/BI Success Metrics naming"
keywords: ["success metrics", "sponsorship", "adoption rate", "time-to-insight"]
estimated_solving_time: 65
question_type: "Multiple Select"
stem: "A warehouse program's executive sponsor is questioning continued investment given slow initial visible progress. Select the two metrics below that would most credibly demonstrate the program's ongoing business value. (Select two.)"
answer_choices:
  - "A) Total number of ETL jobs written"
  - "B) Active usage/adoption rate of the warehouse and its BI tools among intended users"
  - "C) Number of tables in the staging area"
  - "D) Time-to-insight for business users going from a new question to a trustworthy answer"
correct_answer: ["B", "D"]
explanation: "Adoption rate and time-to-insight are both business-relevant measures of whether the warehouse is actually delivering usable value to its intended users, directly countering the perception of a program with diffuse, hard-to-see value."
why_incorrect:
  - option: "A"
    reason: "Total ETL jobs written is an internal engineering-volume metric with no direct signal of business value delivered."
  - option: "C"
    reason: "Staging area table count is an internal technical detail, not a business-relevant success measure."
