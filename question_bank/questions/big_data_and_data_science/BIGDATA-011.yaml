question_type: "Scenario-Based"
stem: "A company deploys two models: one recommends movies to streaming subscribers, and one determines whether a loan applicant is approved. Which model should be held to a stricter explainability standard, and why?"
answer_choices:
  - "A) Both should have identical explainability requirements, since explainability standards are fixed regardless of context"
  - "B) The loan approval model, because the appropriate explainability standard scales with the stakes of the decision it informs, and a credit decision carries far greater consequence than a movie recommendation"
  - "C) The movie recommendation model, since entertainment decisions require more transparency than financial ones"
  - "D) Neither model requires any explainability consideration"
correct_answer: "B"
explanation: "The appropriate explainability bar scales with the stakes of the decision — a credit/loan decision has direct, serious consequences for the applicant and typically regulatory scrutiny, warranting a stronger explainability standard than a low-stakes movie recommendation."
why_incorrect:
  - option: "A"
    reason: "This contradicts the stakes-dependent explainability principle established in this Knowledge Area — a fixed, one-size-fits-all standard ignores materially different decision consequences."
  - option: "C"
    reason: "This reverses the actual risk profile — financial decisions carry far higher consequence and regulatory relevance than entertainment recommendations."
  - option: "D"
    reason: "Both models should have some explainability consideration; the difference is in how strict/rigorous that standard should be, not whether it applies at all."
