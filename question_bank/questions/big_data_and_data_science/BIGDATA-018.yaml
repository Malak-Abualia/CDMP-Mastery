estimated_solving_time: 75
question_type: "Scenario-Based"
stem: "An organization's petabyte-scale data lake has become an unusable data swamp. Leadership wants it fixed but has a small governance team and cannot fund reviewing every dataset immediately. What is the most defensible remediation strategy?"
answer_choices:
  - "A) Delete the entire lake and start over from scratch"
  - "B) Prioritize metadata tagging and ownership assignment for the highest-value, most-used data first, while requiring metadata capture at ingestion for all new data going forward"
  - "C) Wait until the governance team grows large enough to review the entire lake at once before taking any action"
  - "D) Grant every user full access to the entire lake so they can self-organize what they find useful"
correct_answer: "B"
explanation: "Given limited governance resources, prioritizing the highest-value, most-used data first — while stopping the problem from growing by requiring metadata capture on all new ingestion — is the pragmatic, risk-appropriate strategy, directly mirroring the incremental remediation pattern already established for similar sprawl problems in this project."
why_incorrect:
  - option: "A"
    reason: "Deleting the entire lake destroys potentially valuable data without first determining what's actually worth keeping, an unnecessarily destructive overreaction."
  - option: "C"
    reason: "Waiting indefinitely for more resources before taking any action allows the swamp to keep growing and provides no interim improvement."
  - option: "D"
    reason: "Granting unrestricted access does not address the underlying findability/trust problem and actively worsens governance and security risk."
