question_type: "Multiple Choice"
stem: "What is Interoperability?"
answer_choices:
  - "A) The physical movement of data from one system to another"
  - "B) The ability of multiple systems or organizations to exchange and meaningfully use data, requiring agreement on structure and meaning"
  - "C) The scheduled, bulk transfer of data at defined intervals"
  - "D) The process of verifying a user's identity before granting access"
correct_answer: "B"
explanation: "Interoperability is the ability of multiple systems or organizations to exchange and meaningfully use data, requiring agreement on both structure and meaning, not just successful transmission."
why_incorrect:
  - option: "A"
    reason: "This describes Data Integration's movement aspect, a related but distinct concept."
  - option: "C"
    reason: "This describes Batch Integration, one specific data movement pattern, not Interoperability itself."
  - option: "D"
    reason: "This describes Authentication, a Data Security concept, unrelated to system-to-system meaning agreement."
