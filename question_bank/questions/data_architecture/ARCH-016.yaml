question_type: "Scenario-Based"
stem: "PSD2 / Open Banking, a real EU/UK regulatory framework, mandates that banks expose customer account data to authorized third parties via standardized APIs. From a Data Architecture perspective, what does this regulation effectively do?"
answer_choices:
  - "A) It has no architectural implication — APIs are purely an application-layer concern"
  - "B) It dictates a specific Physical Data Architecture integration pattern (API-based access) enterprise-wide, by regulatory mandate rather than internal choice"
  - "C) It replaces the need for a Conceptual Data Architecture in banking"
  - "D) It is a Data Modeling requirement, not an architecture one"
correct_answer: "B"
explanation: "PSD2/Open Banking is effectively a regulator dictating a specific Physical Data Architecture integration pattern (standardized API-based access) enterprise-wide — a clear real-world illustration of how external regulation can force architecture-level decisions rather than leaving them to internal choice."
why_incorrect:
  - option: "A"
    reason: "API-based access as a mandated integration pattern is precisely a Physical Data Architecture decision, not merely an application-layer detail."
  - option: "C"
    reason: "A mandated integration pattern doesn't eliminate the need for Conceptual Architecture — domains and relationships must still be defined to know what the APIs expose."
  - option: "D"
    reason: "This is an enterprise-wide integration-pattern mandate, which is an architecture-level concern, not the structure of a single dataset."
