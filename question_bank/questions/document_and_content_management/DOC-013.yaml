question_type: "Multiple Choice"
stem: "Why does Records Management maintain a documented Chain of Custody for a record?"
answer_choices:
  - "A) To track how many times a record has been viewed for analytics purposes"
  - "B) To maintain a documented, unbroken history of who has had control of the record, supporting its legal defensibility and authenticity if challenged"
  - "C) To determine the record's storage tier for cost optimization"
  - "D) To automatically translate the record into another language"
correct_answer: "B"
explanation: "Chain of Custody documents an unbroken history of control over a record, which is what supports its authenticity and legal defensibility if the record's integrity is ever challenged."
why_incorrect:
  - option: "A"
    reason: "View-count analytics is an unrelated usage-tracking concern, not the purpose of Chain of Custody."
  - option: "C"
    reason: "Storage tier optimization is a Data Storage and Operations cost concern, unrelated to legal defensibility."
  - option: "D"
    reason: "Translation is an unrelated content-processing function, not connected to custody documentation."
