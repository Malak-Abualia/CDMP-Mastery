estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "Which role is formally accountable — typically a business-side role, not IT — for a specific data domain's quality, definition, and appropriate use?"
answer_choices:
  - "A) Data Custodian"
  - "B) Data Engineer"
  - "C) Data Owner"
  - "D) Data Architect"
correct_answer: "C"
explanation: "The Data Owner holds decision-making authority and ultimate accountability for a data domain — approving definitions, approving access-policy exceptions, and answering for the domain's state. Ownership is about accountability, not day-to-day hands-on work."
why_incorrect:
  - option: "A"
    reason: "The Custodian is the technical role responsible for safe storage and handling, not accountability for meaning or appropriate use."
  - option: "B"
    reason: "A Data Engineer is most often a Custodian in practice, implementing decisions rather than owning them."
  - option: "D"
    reason: "A Data Architect designs enterprise-wide data structures — a distinct discipline from data-domain ownership."
