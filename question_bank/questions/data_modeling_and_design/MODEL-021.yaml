estimated_solving_time: 45
question_type: "Multiple Choice"
stem: "A telecom company is designing a Customer dimension for its billing warehouse. Phone numbers are sometimes reassigned to new subscribers after a period of inactivity. Why would a Surrogate Key be preferred over the phone number as the dimension's primary identifier?"
answer_choices:
  - "A) Surrogate keys are required by SQL standards for all warehouse tables"
  - "B) A natural key like phone number can be reused or reassigned, destabilizing historical records tied to that identifier"
  - "C) Surrogate keys are always shorter and are therefore always preferred"
  - "D) Natural keys cannot be used as primary keys under any circumstances"
correct_answer: "B"
explanation: "DMBOK2 frames surrogate vs. natural key as a tradeoff, not a universal rule — surrogate keys are especially valuable in warehouse dimensions specifically because a natural key like a reassignable phone number can change or be reused, which would corrupt historical trend data if used as the stable identifier."
why_incorrect:
  - option: "A"
    reason: "No such SQL requirement exists; using a surrogate key is a design choice, not a syntax rule."
  - option: "C"
    reason: "Length isn't the deciding factor, and framing surrogate keys as 'always' preferred is exactly the exam trap this Knowledge Area documents — surrogate vs. natural is presented as a tradeoff, not a rule."
  - option: "D"
    reason: "Natural keys are routinely used as primary keys, especially in OLTP systems with genuinely stable identifiers."
