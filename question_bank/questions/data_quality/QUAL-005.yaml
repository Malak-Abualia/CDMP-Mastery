question_type: "Multiple Choice"
stem: "What best describes 'fitness for purpose' in DAMA's data quality framing?"
answer_choices:
  - "A) Data quality is an absolute, universal property of a dataset"
  - "B) Data quality is measured relative to the specific use the data serves"
  - "C) Only regulated industries need to consider fitness for purpose"
  - "D) Fitness for purpose only applies to warehouse data"
correct_answer: "B"
explanation: "DMBOK2 frames Data Quality Management around data being 'fit for purpose' — quality is measured against the specific requirements of the people and processes consuming it, not as an abstract, universal property."
why_incorrect:
  - option: "A"
    reason: "This directly contradicts DAMA's relative framing — the same dataset can be fit for one purpose and unfit for another."
  - option: "C"
    reason: "Fitness for purpose applies to all data uses, not only regulated industries."
  - option: "D"
    reason: "The concept applies to any data use case, not exclusively warehouse data."
