estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "What problem does a semantic layer primarily solve in a DW/BI architecture?"
answer_choices:
  - "A) It reduces storage costs by compressing warehouse data"
  - "B) It translates technical warehouse structures into consistent, governed business terms for BI tools and end users"
  - "C) It replaces the need for ETL/ELT pipelines"
  - "D) It automatically enforces row-level security on every query"
correct_answer: "B"
explanation: "The semantic layer's defining purpose is bridging physical warehouse structures and business-friendly, consistently governed terminology, directly extending Business Metadata and Business Glossary concepts into the BI consumption layer."
why_incorrect:
  - option: "A"
    reason: "Storage compression is an unrelated physical/cost optimization concern, not the semantic layer's purpose."
  - option: "C"
    reason: "The semantic layer sits downstream of ETL/ELT; it does not replace the need to extract, load, and transform data into the warehouse in the first place."
  - option: "D"
    reason: "Security enforcement may be layered on top of a semantic layer in some tools, but it is not the semantic layer's defining purpose."
