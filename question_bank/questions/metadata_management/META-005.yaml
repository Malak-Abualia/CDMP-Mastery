stem: "What is a Data Catalog?"
answer_choices:
  - "A) A searchable inventory of an organization's data assets, bringing business, technical, and operational metadata into one discoverable interface"
  - "B) A physical database server"
  - "C) A data quality validation rule engine"
  - "D) A governance escalation process"
correct_answer: "A"
explanation: "A Data Catalog is a searchable inventory of data assets that brings all three metadata categories together into one discoverable interface, a key metadata management deliverable."
why_incorrect:
  - option: "B"
    reason: "A physical database server is infrastructure, not a metadata-management deliverable."
  - option: "C"
    reason: "A validation rule engine belongs to Data Quality Management, not metadata cataloging."
  - option: "D"
    reason: "An escalation process is a Data Governance mechanism, not a metadata artifact."
