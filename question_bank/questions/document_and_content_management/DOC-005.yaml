question_type: "Multiple Choice"
stem: "What is the purpose of a Records Retention Schedule?"
answer_choices:
  - "A) To encrypt sensitive records at rest"
  - "B) To specify exactly how long each category of record must be retained, based on legal, regulatory, and business requirements, and what happens to it afterward"
  - "C) To determine which employees can access a shared drive"
  - "D) To describe the formatting standard for new documents"
correct_answer: "B"
explanation: "A Records Retention Schedule is a governance artifact specifying retention duration per record category, based on legal/regulatory/business requirements, and the eventual disposition (destruction or archival)."
why_incorrect:
  - option: "A"
    reason: "Encryption is a Data Security concern, unrelated to a retention schedule's purpose."
  - option: "C"
    reason: "Access control is a Data Security concern, distinct from retention timing governance."
  - option: "D"
    reason: "Document formatting standards are unrelated to retention governance."
