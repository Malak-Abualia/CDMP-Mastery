question_type: "Multiple Choice"
stem: "What does 'Conceptual Data Architecture' describe?"
answer_choices:
  - "A) Specific technology and infrastructure choices, such as a chosen cloud platform"
  - "B) High-level data domains and their relationships, independent of systems or technology"
  - "C) Index and partitioning strategy for a specific database"
  - "D) A single entity's attributes and primary key"
correct_answer: "B"
explanation: "Conceptual Data Architecture describes high-level domains/subject areas and their relationships, independent of systems or technology — the same three-level pattern as data modeling, but describing the whole system's shape rather than one entity's structure."
why_incorrect:
  - option: "A"
    reason: "Specific technology choices belong to Physical Data Architecture, not the Conceptual layer."
  - option: "C"
    reason: "Index and partitioning strategy is a Database Design concern, several levels more concrete than Conceptual Architecture."
  - option: "D"
    reason: "A single entity's attributes and key describe a Data Model, not the enterprise-wide Conceptual Data Architecture."
