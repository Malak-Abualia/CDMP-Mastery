question_type: "Multiple Choice"
stem: "What is the purpose of a Canonical Data Model?"
answer_choices:
  - "A) To serve as a single, shared, standardized model used as a common reference point for integration across systems"
  - "B) To document the physical indexing strategy for a single database"
  - "C) To replace the need for conceptual and logical modeling entirely"
  - "D) To define access control rules for sensitive attributes"
correct_answer: "A"
explanation: "A Canonical Data Model is a single, shared, standardized model used as a common reference point for integration, reducing point-to-point translation logic between systems."
why_incorrect:
  - option: "B"
    reason: "Indexing strategy is a physical-model, single-database concern, unrelated to a shared integration reference model."
  - option: "C"
    reason: "A Canonical Data Model complements, rather than replaces, the conceptual/logical/physical modeling levels."
  - option: "D"
    reason: "Access control rules are a Data Security/Governance concern, not the purpose of a Canonical Data Model."
