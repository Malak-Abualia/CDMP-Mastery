stem: "What is a Capability Gap?"
answer_choices:
  - "A) The difference between an organization's current assessed maturity level and its desired or required target level"
  - "B) A missing field in a database schema"
  - "C) The time between a security incident and its detection"
  - "D) A discrepancy between two data quality dimension scores"
correct_answer: "A"
explanation: "A Capability Gap is the difference between an organization's current assessed maturity level for a given Knowledge Area and its desired or required target level."
why_incorrect:
  - option: "B"
    reason: "A missing schema field is a Data Modeling and Design concern, unrelated to maturity gap analysis."
  - option: "C"
    reason: "This describes a security detection metric, unrelated to maturity assessment."
  - option: "D"
    reason: "This describes an unrelated data quality measurement discrepancy, not a maturity capability gap."
