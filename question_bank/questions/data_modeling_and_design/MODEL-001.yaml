question_type: "Multiple Choice"
stem: "Which level of data modeling abstraction contains only entities and their relationships, with no attributes or keys?"
answer_choices:
  - "A) Physical Data Model"
  - "B) Logical Data Model"
  - "C) Conceptual Data Model"
  - "D) Canonical Data Model"
correct_answer: "C"
explanation: "The Conceptual Data Model is business-level and technology-agnostic — it communicates what matters to business stakeholders using only entities and relationships, deliberately excluding attributes and keys."
why_incorrect:
  - option: "A"
    reason: "The Physical Data Model is the most detailed level, including tables, columns, data types, and indexes."
  - option: "B"
    reason: "The Logical Data Model adds full attributes, keys, and normalization, going beyond entities and relationships alone."
  - option: "D"
    reason: "A Canonical Data Model is a shared integration reference model, a different concept from the three levels of abstraction."
