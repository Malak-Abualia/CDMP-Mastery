estimated_solving_time: 25
question_type: "Multiple Choice"
stem: "According to DAMA-DMBOK2, what is the core distinction between Data Governance and Data Management?"
answer_choices:
  - "A) Governance is technical execution; Management is strategic planning"
  - "B) Governance defines the 'what' and 'why' (policy, decision rights); Management executes the 'how'"
  - "C) Governance only applies to regulated industries; Management applies universally"
  - "D) Governance and Management are interchangeable terms for the same activities"
correct_answer: "B"
explanation: "DMBOK2 draws a sharp line between Governance (setting direction, defining policy, assigning decision rights and accountability) and Management (the operational execution of those decisions). This distinction recurs across nearly every DMBOK2 chapter, not just this one."
why_incorrect:
  - option: "A"
    reason: "This reverses the actual distinction — governance is not 'technical execution' and management is not abstract strategic planning."
  - option: "C"
    reason: "Governance applies across all data domains, not only regulated industries, though regulated industries often make the need more visible."
  - option: "D"
    reason: "Treating the two as interchangeable ignores DAMA's explicit definitional split and is a documented exam trap."
