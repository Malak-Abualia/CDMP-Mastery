keywords: ["consent quality", "bundled consent", "opt-out"]
estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "An app requires users to accept location tracking, marketing communications, and third-party data sharing as a single bundled 'agree to all or cannot use the app' choice. Does this satisfy genuine informed consent, per this Knowledge Area's principles?"
answer_choices:
  - "A) Yes, since the user technically clicked 'agree'"
  - "B) No — bundling unrelated consent choices into an all-or-nothing agreement undermines genuine, specific, informed consent for each individual use"
  - "C) Yes, as long as the bundled agreement is legally reviewed"
  - "D) This scenario is unrelated to consent, since no personal data is directly named"
correct_answer: "B"
explanation: "Bundling distinct data uses into a single all-or-nothing agreement prevents genuine, specific consent to each individual use, undermining the informed consent standard even if technically clicked."
why_incorrect:
  - option: "A"
    reason: "A technical click does not, by itself, establish genuine understanding or specific agreement to each bundled use."
  - option: "C"
    reason: "Legal review confirms compliance, not whether the consent mechanism meets the ethical standard of genuine, specific understanding."
  - option: "D"
    reason: "Location tracking, marketing communications, and data sharing are all forms of personal data use directly relevant to consent evaluation."
