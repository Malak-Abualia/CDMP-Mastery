estimated_solving_time: 75
question_type: "Scenario-Based"
stem: "An organization discovers 60+ ungoverned point-to-point connections across 18 systems, with no central inventory. Leadership wants this fixed but cannot tolerate a multi-month freeze on all other engineering work. What is the most defensible remediation approach?"
answer_choices:
  - "A) Freeze all engineering work until every single connection is rebuilt through a new central hub simultaneously"
  - "B) Incrementally inventory existing connections and migrate the highest-connection-count, highest-risk systems toward a shared hub or event-driven model first, without requiring an all-at-once rewrite"
  - "C) Leave the architecture as-is, since 60 connections is manageable for 18 systems"
  - "D) Immediately delete any connection not documented, regardless of whether it is still in active use"
correct_answer: "B"
explanation: "An incremental approach — starting with an inventory (a lineage/metadata exercise) and prioritizing the highest-risk, highest-connection-count systems for migration first — reduces risk without requiring a disruptive, all-at-once freeze that leadership has explicitly ruled out."
why_incorrect:
  - option: "A"
    reason: "This directly contradicts leadership's explicit constraint against a multi-month freeze on other engineering work, and is unnecessarily disruptive compared to an incremental approach."
  - option: "C"
    reason: "60+ ungoverned connections with no central inventory is precisely the documented spaghetti architecture risk, not a manageable, low-risk state."
  - option: "D"
    reason: "Deleting undocumented connections without first confirming whether they are still in active use risks breaking live business processes, an unnecessarily reckless approach compared to inventorying first."
