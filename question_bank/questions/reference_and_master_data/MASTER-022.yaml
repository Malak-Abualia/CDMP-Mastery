estimated_solving_time: 40
question_type: "Multiple Choice"
stem: "In which MDM implementation style does the golden record become the single system of record, with source and consuming applications reading and writing directly against it rather than maintaining their own local master copies?"
answer_choices:
  - "A) Registry style"
  - "B) Consolidation style"
  - "C) Coexistence style"
  - "D) Centralized style"
correct_answer: "D"
explanation: "Centralized style, also called a transaction hub, makes the golden record the single system of record — applications read and write directly against the central hub rather than maintaining local master copies at all, the strongest consistency guarantee of the four styles at the cost of the most disruptive re-architecture."
why_incorrect:
  - option: "A"
    reason: "Registry style is the lightest-touch approach, the opposite of Centralized's full re-architecture."
  - option: "B"
    reason: "Consolidation still leaves source systems maintaining their own independent local copies."
  - option: "C"
    reason: "Coexistence retains local autonomy with bidirectional synchronization, not direct read/write against one hub."
