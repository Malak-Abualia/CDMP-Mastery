question_type: "Multiple Choice"
stem: "What is Technical Metadata?"
answer_choices:
  - "A) Metadata describing the technical structure and characteristics of data, such as schemas, data types, and transformation logic"
  - "B) A governed collection of business term definitions"
  - "C) Metadata describing job execution status and error rates"
  - "D) A sensitivity classification label such as 'PII — Restricted'"
correct_answer: "A"
explanation: "Technical Metadata describes the technical structure and characteristics of data — schemas, data types, and the technical mechanics of how data is produced and transformed."
why_incorrect:
  - option: "B"
    reason: "This describes a Business Glossary, a Business Metadata artifact, not Technical Metadata."
  - option: "C"
    reason: "This describes Operational Metadata, which concerns runtime execution facts, not structure."
  - option: "D"
    reason: "A sensitivity classification label is Business Metadata, since it concerns meaning and appropriate use, not structure."
