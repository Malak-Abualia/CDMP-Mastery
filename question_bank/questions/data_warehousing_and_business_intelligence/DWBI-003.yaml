question_type: "Multiple Choice"
stem: "What is a Data Mart?"
answer_choices:
  - "A) The enterprise-wide integrated store all reporting is ultimately built from"
  - "B) A subset of warehouse-scope data, typically organized around a single business subject area or department"
  - "C) A landing zone for raw extracted data prior to transformation"
  - "D) A multidimensional cube structure used for fast aggregation"
correct_answer: "B"
explanation: "A Data Mart is a narrower-scope subset of warehouse data, typically aligned to one subject area or department, as distinct from the broader enterprise warehouse."
why_incorrect:
  - option: "A"
    reason: "This describes the Data Warehouse itself, the broader store a dependent mart is sourced from."
  - option: "C"
    reason: "This describes a Staging Area, not a Data Mart."
  - option: "D"
    reason: "This describes an OLAP Cube, an analytical query structure, not a data mart."
