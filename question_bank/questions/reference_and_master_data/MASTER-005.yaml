question_type: "Multiple Choice"
stem: "What is a Value Domain?"
answer_choices:
  - "A) The bounded, permitted set of values a Reference Data code set defines, such as {Pending, Shipped, Delivered, Cancelled} for Order Status"
  - "B) The physical server region where master data is hosted"
  - "C) A synonym for Master Data"
  - "D) A rule for merging duplicate customer records"
correct_answer: "A"
explanation: "A Value Domain is the precise term for the bounded, permitted set of values a Reference Data code set defines."
why_incorrect:
  - option: "B"
    reason: "Server hosting region is an infrastructure/Technology Architecture concern, unrelated to a code set's permitted values."
  - option: "C"
    reason: "Master Data concerns shared business entities, an entirely different concept from a bounded set of code values."
  - option: "D"
    reason: "This describes Matching/Merging or Survivorship, MDM concepts, not a Reference Data Value Domain."
