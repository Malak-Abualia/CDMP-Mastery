question_type: "Multiple Choice"
stem: "What is Reference Data?"
answer_choices:
  - "A) The authoritative, agreed representation of an organization's core shared business entities"
  - "B) A controlled, standardized set of permissible values used to classify or categorize other data"
  - "C) A record produced by matching and merging multiple source records"
  - "D) The technical structure of a database table"
correct_answer: "B"
explanation: "Reference Data is a controlled, standardized set of permissible values used to classify or categorize other data — such as country codes or status codes — rather than a unique real-world entity."
why_incorrect:
  - option: "A"
    reason: "This describes Master Data, a distinct concept representing shared business entities, not controlled classification values."
  - option: "C"
    reason: "This describes a Golden Record, an MDM output, unrelated to Reference Data's controlled-value concept."
  - option: "D"
    reason: "Database table structure is a Data Modeling concern, not Reference Data itself."
