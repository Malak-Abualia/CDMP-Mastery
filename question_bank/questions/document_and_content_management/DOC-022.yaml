question_type: "Scenario-Based"
stem: "A telecom company's Information Governance team documents a Records Retention Schedule specifying exactly how long call detail records must be retained and when they must be destroyed, approved through the same governance process used for the company's other mandatory, measurable data requirements. Within DAMA's Policy → Standard → Procedure governance artifact hierarchy, which tier does a Records Retention Schedule correspond to?"
answer_choices:
  - "A) Policy, since retention is a high-level statement of organizational intent"
  - "B) Standard, since it is a specific, measurable, mandatory requirement that operationalizes a broader governance policy — exactly the same governed sense as a data quality or security standard"
  - "C) Procedure, since it only concerns step-by-step destruction instructions"
  - "D) Guideline, since retention periods are recommended but not mandatory"
correct_answer: "B"
explanation: "Information Governance is this Knowledge Area's direct extension of Data Governance's Policy/Standard/Procedure hierarchy to unstructured content — a Records Retention Schedule is a Standard in exactly the same governed sense as a data quality or security standard: a specific, measurable, mandatory requirement operationalizing a broader policy."
why_incorrect:
  - option: "A"
    reason: "A Policy is the high-level statement of intent (e.g., 'the company will retain records per legal and regulatory requirements') that the Retention Schedule operationalizes — the Schedule itself is more specific and measurable than a Policy."
  - option: "C"
    reason: "A Procedure would be the step-by-step instructions for executing disposition once the Schedule's period elapses — the Schedule itself is the specific requirement, not the execution steps."
  - option: "D"
    reason: "Retention periods in a Records Retention Schedule are mandatory, not optional/recommended — that mandatory status is precisely what distinguishes a Standard from a Guideline."
