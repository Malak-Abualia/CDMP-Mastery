question_type: "Multiple Select"
stem: "Select the three activities below that fall within Database Operations, as defined in this Knowledge Area. (Select three.)"
answer_choices:
  - "A) Continuous monitoring of system health and performance"
  - "B) Forecasting future storage and performance needs based on growth trends"
  - "C) Approving survivorship rules for conflicting master data attribute values"
  - "D) Controlled deployment of schema changes and patches without unplanned downtime"
  - "E) Designing a conceptual data model for a new subject area"
correct_answer: ["A", "B", "D"]
explanation: "Monitoring, capacity planning, and change/release management are all core Database Operations activities, concerned with keeping database environments healthy and available on an ongoing basis."
why_incorrect:
  - option: "C"
    reason: "Approving survivorship rules is a Master Data Management / Data Governance activity, unrelated to database operational management."
  - option: "E"
    reason: "Conceptual data modeling is a Data Modeling and Design activity, occurring before physical implementation, not an operational activity."
