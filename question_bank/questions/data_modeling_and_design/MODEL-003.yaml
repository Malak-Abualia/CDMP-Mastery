question_type: "Multiple Choice"
stem: "What is a Surrogate Key?"
answer_choices:
  - "A) A real-world, business-meaningful identifier such as an email address"
  - "B) A system-generated, meaningless identifier used instead of, or alongside, a natural key"
  - "C) An attribute referencing another entity's primary key"
  - "D) A rule for eliminating partial dependency on a composite key"
correct_answer: "B"
explanation: "A Surrogate Key is a system-generated identifier (such as an auto-incrementing integer or UUID) with no inherent business meaning, especially common in warehouse dimensions where natural keys can change or be reused."
why_incorrect:
  - option: "A"
    reason: "This describes a Natural Key, the opposite concept — a business-meaningful identifier."
  - option: "C"
    reason: "This describes a Foreign Key, which implements a relationship, not an identity."
  - option: "D"
    reason: "This describes Second Normal Form (2NF), a normalization rule, not a key type."
