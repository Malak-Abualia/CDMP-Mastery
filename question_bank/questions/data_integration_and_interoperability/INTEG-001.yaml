stem: "What is Data Integration?"
answer_choices:
  - "A) The ability of systems to agree on the meaning of exchanged data"
  - "B) The processes related to the movement and consolidation of data within and between data stores, applications, and organizations"
  - "C) The categorization of data according to its sensitivity"
  - "D) The coordinated sequencing of multiple integration jobs and their dependencies"
correct_answer: "B"
explanation: "Data Integration is the processes related to the movement and consolidation of data within and between data stores, applications, and organizations."
why_incorrect:
  - option: "A"
    reason: "This describes Interoperability, a distinct, related concept concerned with meaning rather than movement."
  - option: "C"
    reason: "This describes Data Classification, a Data Security concept, unrelated to data movement."
  - option: "D"
    reason: "This describes Orchestration, a related but distinct integration concept."
